arar → punir → acolher.", "B": "Acolher → proteger → investigar → responder → reparar.", "C": "Responder → acolher → esquecer → investigar → excluir.", "D": "Proteger → silenciar → avaliar → afastar → reparar.", "E": "Acolher → punir imediatamente → investigar → ignorar → responder."}, "c": "B", "e": "O exemplo segue acolher → proteger → investigar → responder → reparar.", "a": 4}, {"n": 63, "q": "Qual alternativa apresenta corretamente um dos cinco princípios de uma organização inclusiva?", "o": {"A": "Apenas a maioria precisa de condições de expressão.", "B": "Toda norma deve ser preservada sem questionamento.", "C": "Nenhuma diferença justifica menor dignidade.", "D": "Escutar não exige resposta.", "E": "Responsabilização é incompatível com inclusão."}, "c": "C", "e": "“Nenhuma diferença justifica menor dignidade” é um dos cinco princípios.", "a": 4}, {"n": 64, "q": "Comunicação, na definição apresentada na aula, é principalmente:", "o": {"A": "Uma atividade exclusivamente escrita.", "B": "Apenas emissão de sinais.", "C": "Apenas transmissão de informação.", "D": "Transferência e compreensão de significado entre pessoas.", "E": "Somente fala."}, "c": "D", "e": "Comunicação é definida como transferência e compreensão de significado entre pessoas.", "a": 5}, {"n": 65, "q": "Uma comunicação só atinge o sentido completo apresentado nos slides quando:", "o": {"A": "A mensagem é escrita.", "B": "Não existem emoções.", "C": "O emissor fala muito.", "D": "O receptor concorda com tudo.", "E": "O significado é transmitido e compreendido pelo receptor."}, "c": "E", "e": "O significado precisa ser transmitido e compreendido pelo receptor.", "a": 5}, {"n": 66, "q": "“Dois colegas vivenciam o mesmo acontecimento, mas saem com interpretações diferentes.” Isso pode ser explicado pelo conceito de:", "o": {"A": "Realidade psíquica.", "B": "Formação de equipe.", "C": "Tríplice contingência.", "D": "Norma grupal.", "E": "Feedback."}, "c": "A", "e": "A realidade psíquica pode ser diferente porque cada pessoa registra e interpreta estímulos de modo próprio.", "a": 5}, {"n": 67, "q": "Sensação e percepção diferem porque:", "o": {"A": "Sensação interpreta; percepção apenas recebe.", "B": "Sensação é a chegada da informação ao cérebro; percepção é sua interpretação mediada por experiências, crenças, emoções e contexto.", "C": "São sinônimos.", "D": "Percepção depende apenas da genética.", "E": "Sensação ocorre apenas em ambientes organizacionais."}, "c": "B", "e": "Sensação é chegada da informação; percepção é interpretação mediada por fatores internos e contextuais.", "a": 5}, {"n": 68, "q": "Limiar inferior é:", "o": {"A": "Um estágio de Piaget.", "B": "O nível acima do qual ocorre saturação.", "C": "O nível mínimo de estímulo reconhecível.", "D": "Uma forma de percepção subliminar.", "E": "Uma consequência social."}, "c": "C", "e": "Limiar inferior = menor nível de estímulo reconhecível.", "a": 5}, {"n": 69, "q": "Qual conjunto contém fatores citados nos slides que podem afetar a percepção?", "o": {"A": "Apenas inteligência e memória.", "B": "Somente genética.", "C": "Exclusivamente fatores externos.", "D": "Experiências anteriores, conhecimentos, crenças/valores, emoções/expectativas e situação.", "E": "Apenas temperatura e iluminação."}, "c": "D", "e": "Todos os fatores listados aparecem na aula como influências sobre percepção.", "a": 5}, {"n": 70, "q": "Na relação figura-fundo:", "o": {"A": "A percepção deixa de existir.", "B": "A memória fica bloqueada.", "C": "O receptor não interpreta estímulos.", "D": "O cérebro trata todos os estímulos com a mesma prioridade.", "E": "O cérebro seleciona uma porção como figura e o restante como fundo."}, "c": "E", "e": "O cérebro seleciona uma figura e organiza o restante como fundo.", "a": 5}, {"n": 71, "q": "Uma pessoa interpreta um comentário neutro como uma crítica devido ao seu estado emocional. Esse caso é exemplo de:", "o": {"A": "Ilusão perceptiva.", "B": "Feedback positivo.", "C": "Grupo de referência.", "D": "Consideração positiva.", "E": "Normatização."}, "c": "A", "e": "A interpretação incorreta de um estímulo real é exemplo de ilusão perceptiva.", "a": 5}, {"n": 72, "q": "A atenção pode ser definida como o processo que:", "o": {"A": "Registra fielmente toda informação.", "B": "Seleciona e descarta estímulos que chegam ao cérebro.", "C": "Produz apenas emoções positivas.", "D": "Elimina a memória.", "E": "Determina o estágio de Piaget."}, "c": "B", "e": "Atenção seleciona alguns estímulos e descarta outros.", "a": 5}, {"n": 73, "q": "Entre os fatores internos da atenção estão:", "o": {"A": "Intensidade e novidade.", "B": "Repetição do estímulo.", "C": "Necessidades, objetivos e motivações.", "D": "Volume e velocidade da fala.", "E": "Gestos e postura."}, "c": "C", "e": "Necessidades, objetivos e motivações são fatores internos de atenção.", "a": 5}, {"n": 74, "q": "Sobre memória, é correto afirmar que:", "o": {"A": "Falsas lembranças são impossíveis.", "B": "Uma lembrança muito vívida prova que ocorreu exatamente daquela forma.", "C": "A memória é uma réplica perfeita da experiência.", "D": "A memória pode ser reconstrutora e sofrer distorções.", "E": "Emoções nunca interferem na memória."}, "c": "D", "e": "Memória é reconstrutora e pode apresentar distorções.", "a": 5}, {"n": 75, "q": "Qual exemplo corresponde à INDUÇÃO DE FALSAS LEMBRANÇAS?", "o": {"A": "Uma pessoa sentir medo.", "B": "Um aluno prestar mais atenção.", "C": "Um grupo criar uma norma.", "D": "Uma pessoa lembrar mais detalhes após estudar.", "E": "Um adulto fazer perguntas sugestivas que influenciem a lembrança de uma criança."}, "c": "E", "e": "Perguntas sugestivas podem induzir lembranças que não ocorreram daquela forma.", "a": 5}, {"n": 76, "q": "Segundo os slides, a linguagem:", "o": {"A": "Possibilita representar o mundo e pode influenciar o que se pensa.", "B": "Serve somente para transmitir fatos objetivos.", "C": "Impede a formação de vieses.", "D": "É independente do pensamento.", "E": "Não influencia conflitos."}, "c": "A", "e": "A linguagem representa o mundo e influencia o pensamento e os conflitos.", "a": 5}, {"n": 77, "q": "Qual emoção é associada, nos slides, ao estreitamento do campo atencional e ao comprometimento da recuperação de memórias?", "o": {"A": "Alegria.", "B": "Ansiedade.", "C": "Orgulho.", "D": "Surpresa.", "E": "Felicidade."}, "c": "B", "e": "A ansiedade é associada a estreitamento da atenção e prejuízo da recuperação de memórias.", "a": 5}, {"n": 78, "q": "Na comunicação corporal e paralinguística (CCP), qual alternativa está correta?", "o": {"A": "Gestos e postura pertencem à paralinguagem.", "B": "Volume e velocidade pertencem à comunicação corporal.", "C": "Gestos, postura, expressões e contato visual são corporais; modulação, volume, velocidade e fluência são paralinguísticos.", "D": "CCP é apenas o conteúdo verbal.", "E": "CCP não interfere na competência social."}, "c": "C", "e": "Corporal inclui gestos/postura/expressões/contato visual; paralinguagem inclui modulação/volume/velocidade/fluência.", "a": 7}, {"n": 79, "q": "Quando os slides dizem que “o que falamos” e “como falamos” nem sempre são congruentes, isso significa que:", "o": {"A": "Paralinguagem é sinônimo de escrita.", "B": "O receptor não interpreta a forma da fala.", "C": "A linguagem verbal é sempre falsa.", "D": "A forma de comunicar pode transmitir sinais diferentes do conteúdo literal.", "E": "Comunicação corporal não possui importância."}, "c": "D", "e": "O conteúdo literal e a forma da comunicação podem transmitir sinais incongruentes.", "a": 7}, {"n": 80, "q": "A automonitoria da CCP envolve:", "o": {"A": "Evitar contato visual.", "B": "Responder imediatamente a tudo.", "C": "Usar sempre o mesmo tom de voz.", "D": "Falar sem observar o interlocutor.", "E": "Observar a própria comunicação e a dos outros, verificar impactos e ajustar comportamentos."}, "c": "E", "e": "Automonitoria envolve observar, verificar impacto e ajustar a CCP.", "a": 7}, {"n": 81, "q": "Qual alternativa melhor define empatia na comunicação?", "o": {"A": "Compreender/sentir o que o outro pensa ou sente e comunicar essa compreensão.", "B": "Resolver o problema pelo outro sem perguntar.", "C": "Dar conselhos imediatamente.", "D": "Evitar qualquer emoção.", "E": "Concordar sempre com a pessoa."}, "c": "A", "e": "Empatia envolve compreender/sentir e comunicar essa compreensão.", "a": 7}, {"n": 82, "q": "Qual comportamento é mais compatível com uma comunicação empática?", "o": {"A": "“Isso não é nada, esquece.”", "B": "“Vejo que você está magoada com isso. Quer me contar o que aconteceu?”", "C": "“Você está exagerando.”", "D": "“Eu já passei por coisa pior.”", "E": "“Você precisa fazer exatamente o que eu faria.”"}, "c": "B", "e": "Reconhece a situação, oferece apoio e abre espaço para o outro falar.", "a": 7}, {"n": 83, "q": "Um elogio eficaz, segundo os slides, deve ser:", "o": {"A": "Feito apenas por escrito.", "B": "Genérico, tardio e exagerado.", "C": "Sincero, específico/direto e imediato.", "D": "Sempre acompanhado de crítica.", "E": "Anônimo e indireto."}, "c": "C", "e": "O elogio eficaz deve ser sincero, específico/direto e imediato.", "a": 7}, {"n": 84, "q": "Feedback é definido nos slides como:", "o": {"A": "Uma conversa obrigatoriamente negativa.", "B": "Uma avaliação exclusivamente numérica.", "C": "Uma crítica à personalidade.", "D": "Uma descrição, verbal ou escrita, sobre o desempenho de uma pessoa.", "E": "Uma punição formal."}, "c": "D", "e": "Feedback é descrição verbal ou escrita sobre desempenho.", "a": 8}, {"n": 85, "q": "Qual alternativa representa melhor um feedback adequado?", "o": {"A": "“Todo mundo acha que você está mal.”", "B": "“Você precisa melhorar.”", "C": "“Você é desorganizado.”", "D": "“Você sempre faz tudo certo, é o melhor.”", "E": "“João, nas duas últimas semanas os e-mails aos clientes saíram após o prazo de 24 horas, impactando o tempo de resposta do setor.”"}, "c": "E", "e": "É específico, descreve comportamento e impacto, sem rotular a pessoa.", "a": 8}, {"n": 86, "q": "Uma das principais recomendações para o feedback é:", "o": {"A": "Falar diretamente com a pessoa e, quando possível, logo após o desempenho.", "B": "Rotular a personalidade.", "C": "Usar generalizações.", "D": "Falar somente sobre intenções.", "E": "Esperar meses para que a situação seja esquecida."}, "c": "A", "e": "O feedback deve ser direto e o mais imediato possível após o desempenho.", "a": 8}, {"n": 87, "q": "“Descreva o desempenho em vez de avaliá-lo” significa:", "o": {"A": "Evitar qualquer informação concreta.", "B": "Trocar rótulos e julgamentos gerais por descrição do que foi observado.", "C": "Fazer elogios exagerados.", "D": "Não mencionar comportamentos.", "E": "Avaliar a pessoa como um todo."}, "c": "B", "e": "Descrever é falar do que foi observado, em vez de rotular a pessoa.", "a": 8}, {"n": 88, "q": "Qual afirmação representa a assertividade?", "o": {"A": "“Eu sempre faço o que os outros querem.”", "B": "“Eu mando e os outros obedecem.”", "C": "“Eu penso diferente e quero explicar meu ponto sem desrespeitar você.”", "D": "“Prefiro não falar nada para evitar conflito.”", "E": "“Se você discorda, problema seu.”"}, "c": "C", "e": "Discordar sem atacar, expressando o próprio ponto, é típico de assertividade.", "a": 8}, {"n": 89, "q": "Qual relação está correta?", "o": {"A": "Agressividade = respeito aos limites alheios.", "B": "Passividade = postura equilibrada.", "C": "Agressividade = respeito simultâneo aos dois lados.", "D": "Assertividade = respeito a si e ao outro simultaneamente.", "E": "Passividade = comunicação direta e respeitosa."}, "c": "D", "e": "Assertividade respeita simultaneamente os próprios direitos e os do outro.", "a": 8}, {"n": 90, "q": "Qual é uma característica do comportamento assertivo?", "o": {"A": "Ignorar os próprios limites.", "B": "Usar tom hostil.", "C": "Dizer “sim” por submissão.", "D": "Evitar contato visual.", "E": "Falar na primeira pessoa e expressar discordância sem atacar."}, "c": "E", "e": "Primeira pessoa e discordância sem ataque são características destacadas.", "a": 8}, {"n": 91, "q": "Segundo os slides, a combinação entre empatia e assertividade:", "o": {"A": "Forma o núcleo da competência social.", "B": "É incompatível com feedback.", "C": "Substitui todas as competências técnicas.", "D": "É apenas uma técnica de liderança.", "E": "Elimina toda divergência."}, "c": "A", "e": "Empatia + assertividade formam o núcleo da competência social na apresentação.", "a": 8}, {"n": 92, "q": "Um gestor diz: “Marina, durante o atendimento desta manhã o cliente precisou repetir a solicitação três vezes antes de ser encaminhado. Vale observar esse ponto nos próximos atendimentos.” Esse feedback é adequado principalmente porque:", "o": {"A": "Usa generalizações.", "B": "Descreve um comportamento observado e aponta uma mudança possível.", "C": "Fala apenas sobre intenções.", "D": "É totalmente indireto.", "E": "Rotula a personalidade."}, "c": "B", "e": "O exemplo descreve um comportamento observado e aponta um ajuste possível, sem atacar a pessoa.", "a": 8}, {"n": 93, "q": "No “espectro da grupalidade” apresentado no material complementar, um conjunto tende a se tornar mais grupo quando:", "o": {"A": "Aumentam a interação, a história compartilhada e a clareza de futuro, considerando também um número mais reduzido de integrantes.", "B": "Aumenta o número de integrantes e diminui a interação.", "C": "Desaparecem os vínculos e os objetivos compartilhados.", "D": "Cada membro trabalha sem depender dos demais.", "E": "A comunicação passa a ser exclusivamente formal."}, "c": "A", "e": "O espectro considera quatro dimensões de intensidade: número, interação, história compartilhada e futuro partilhado.", "a": "3c"}, {"n": 94, "q": "Na “anatomia de uma equipe”, interdependência significa que:", "o": {"A": "Os membros devem trabalhar isoladamente para evitar conflitos.", "B": "O êxito da meta exige contribuição e interação de todos os membros.", "C": "Somente o líder é responsável pelo resultado final.", "D": "A equipe não precisa de objetivo coletivo.", "E": "A organização deve tomar todas as decisões pela equipe."}, "c": "B", "e": "Interdependência significa que o êxito da meta depende da contribuição e interação de todos.", "a": "3c"}, {"n": 95, "q": "O material complementar chama o líder de “sintetizador” porque ele deve principalmente:", "o": {"A": "Impor suas próprias preferências ao grupo.", "B": "Ser necessariamente o membro mais inteligente.", "C": "Conjugar as aspirações do grupo com as metas organizacionais.", "D": "Evitar ouvir os membros para manter autoridade.", "E": "Substituir todas as normas grupais por normas formais."}, "c": "C", "e": "O líder sintetizador alinha as aspirações internas do grupo às metas da organização.", "a": "3c"}, {"n": 96, "q": "Sobre o desenvolvimento das equipes, o material complementar enfatiza que:", "o": {"A": "Os estágios são sempre lineares e irreversíveis.", "B": "A equipe nunca pode retornar a um estágio anterior.", "C": "A fase de conflito deve ser eliminada o mais rápido possível.", "D": "Interferências internas ou externas podem provocar regressão de estágios.", "E": "Desempenho acontece antes da normatização."}, "c": "D", "e": "O desenvolvimento não é estritamente linear; fatores internos/externos podem fazer a equipe regredir.", "a": "3c"}, {"n": 97, "q": "Na fase de CONFLITO, a orientação destacada no material é:", "o": {"A": "Eliminar todo conflito antes de qualquer negociação.", "B": "Gerenciar o conflito para construir alinhamento.", "C": "Ignorar disputas sobre papéis.", "D": "Dissolver a equipe imediatamente.", "E": "Impedir que lideranças surjam."}, "c": "B", "e": "O conflito não deve ser eliminado prematuramente; ele deve ser gerenciado para produzir alinhamento.", "a": "3c"}, {"n": 98, "q": "Sobre a DESINTEGRAÇÃO, qual afirmação está de acordo com o material complementar?", "o": {"A": "Ela representa sempre uma falha da equipe.", "B": "Só ocorre em equipes permanentes.", "C": "Pode representar a conclusão do projeto; em equipes temporárias, a meta atingida pode levar à dissolução e realocação dos integrantes.", "D": "Significa necessariamente abandono das metas.", "E": "Impede que equipes permanentes iniciem novos ciclos."}, "c": "C", "e": "Desintegração pode ser o fechamento normal de um projeto, especialmente em equipes temporárias.", "a": "3c"}, {"n": 99, "q": "Qual conjunto corresponde aos quatro elementos do “motor da efetividade” apresentados no material complementar?", "o": {"A": "Tamanho e competências; autonomia e suporte; recompensas; feedback periódico.", "B": "Carisma; competição; punição; silêncio.", "C": "Coesão; interdependência; hierarquia; controle.", "D": "Memória; percepção; atenção; emoção.", "E": "Estereótipo; preconceito; discriminação; norma."}, "c": "A", "e": "O motor é composto por tamanho/competências, autonomia/suporte, recompensas e feedback periódico.", "a": "3c"}, {"n": 100, "q": "No material complementar, o feedback periódico é valorizado porque permite:", "o": {"A": "Adiar correções até o final do projeto.", "B": "Avaliar somente a personalidade dos integrantes.", "C": "Fazer correção de rota com avaliações oportunas e métricas claras.", "D": "Eliminar a necessidade de autonomia.", "E": "Substituir as metas coletivas por metas individuais."}, "c": "C", "e": "Feedback oportuno e baseado em métricas permite perceber desvios e corrigir a rota durante o trabalho.", "a": "3c"}]};

  return it.t==='li'?`<li>${inner}</li>`:`<p>${inner}</p>`;
};
const secHtml=s=>{let h='',ul=false;s.items.forEach(it=>{if(it.t==='li'&&!ul){h+='<ul>';ul=true}if(it.t!=='li'&&ul){h+='</ul>';ul=false}h+=fmt(it)});if(ul)h+='</ul>';return `<div class="sec"><h3>${esc(s.title)}</h3>${h}</div>`};
function renderAulas(){
  $('#aulas').innerHTML=D.aulas.map(a=>`<details class="aula" id="a${a.id}" ${S.open[a.id]?'open':''}><summary><span class="badge">Aula ${a.id}</span><h2>${esc(a.title)}</h2><span class="chev">▶</span></summary><div class="body">${a.secs.map(secHtml).join('')}<label class="done"><input type="checkbox" data-a="${a.id}" ${S.done[a.id]?'checked':''}> Marcar aula como revisada</label></div></details>`).join('');
  $$('#aulas details').forEach(d=>d.addEventListener('toggle',()=>{S.open[d.id.slice(1)]=d.open;save()}));
  $$('.done input').forEach(c=>c.onchange=()=>{S.done[c.dataset.a]=c.checked;save();studyProg()});
  $('#aulachips').innerHTML=D.aulas.map(a=>`<button class="chip" data-a="${a.id}">Aula ${a.id}</button>`).join('')+'<button class="chip" data-a="resumao">⚡ Resumão</button><button class="chip" data-a="macetes">💡 Macetes</button>';
  $$('#aulachips .chip').forEach(c=>c.onclick=()=>{const el=$('#'+(isNaN(c.dataset.a)?c.dataset.a:'a'+c.dataset.a));el.open=true;el.scrollIntoView({behavior:'smooth'})});
  const ql=r=>{const i=r.search(/ = |: /);return i>0?`<li><b>${esc(r.slice(0,i))}</b>${esc(r.slice(i))}</li>`:`<li>${esc(r)}</li>`};
  $('#frase').textContent='“'+D.frase+'”';$('#rlist').innerHTML=D.resumo.map(ql).join('');
  $('#mlist').innerHTML=D.macetes.map((m,i)=>`<li><b>${i+1}.</b> ${esc(m)}</li>`).join('');
  studyProg();
}
function studyProg(){const n=D.aulas.filter(a=>S.done[a.id]).length,t=D.aulas.length,p=Math.round(n/t*100);$('#sp-t').textContent=`${n} de ${t} aulas revisadas`;$('#sp-p').textContent=p+'%';$('#sp-b').style.width=p+'%'}
let bt;$('#busca').oninput=e=>{clearTimeout(bt);bt=setTimeout(()=>search(e.target.value.trim()),180)};
function search(q){
  $$('#aulas mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));
  $$('.sec').forEach(s=>s.style.display='');$$('.aula').forEach(a=>a.style.display='');
  if(q.length<2)return;
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  $$('#aulas .aula').forEach(a=>{let any=false;
    a.querySelectorAll('.sec').forEach(s=>{if(re.test(s.textContent)){any=true;re.lastIndex=0;
      const w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);
      nodes.forEach(n=>{if(re.test(n.nodeValue)){re.lastIndex=0;const sp=document.createElement('span');sp.innerHTML=esc(n.nodeValue).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark class="hl">${m}</mark>`);n.replaceWith(sp)}re.lastIndex=0})
    }else s.style.display='none';re.lastIndex=0});
    a.style.display=any?'':'none';if(any)a.open=true});
}

/* ---------- QUESTÕES ---------- */
let fa='all';
const rnd=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
function order(q){const L=['A','B','C','D','E'];if(!S.shuf)return L;const r=rnd(q.n*7919+S.seed*104729);const a=[...L];for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderQ(){
  const list=D.qs.filter(q=>(fa==='all'||String(q.a)===fa)&&($('#status').value==='all'||($('#status').value==='open'&&!S.ans[q.n])||($('#status').value==='err'&&S.ans[q.n]&&S.ans[q.n]!==q.c)));
  $('#qlist').innerHTML=list.length?list.map(q=>{const a=S.ans[q.n];const o=order(q);
    return `<div class="card q" id="q${q.n}"><div class="qh"><div class="qn">${q.n}</div><div><span class="tag">${AN[q.a]}</span><div class="qt">${esc(q.q)}</div></div></div><div class="opts">${o.map((L,i)=>{let c='';if(a){if(L===q.c)c='right';else if(L===a)c='wrong'}return `<button class="opt ${c}" data-q="${q.n}" data-l="${L}" ${a?'disabled':''}><span class="lt">${'ABCDE'[i]}</span><span>${esc(q.o[L])}</span></button>`}).join('')}</div>${a?fbHtml(q,a):''}</div>`}).join(''):'<div class="empty">Nenhuma questão neste filtro. 🎉</div>';
  $$('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.q,b.dataset.l));
  qStats();
}
const fbHtml=(q,a)=>{const ok=a===q.c;return `<div class="fb show ${ok?'ok':'no'}"><b>${ok?'✅ Correto!':'❌ Incorreto.'}</b>${ok?'':'Correta: '+esc(q.o[q.c])+'<br>'}<span style="color:var(--dim)">${esc(q.e)}</span></div>`};
function answer(n,l){if(S.ans[n])return;S.ans[n]=l;save();
  const q=D.qs.find(x=>x.n===n),card=$('#q'+n);
  card.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.l===q.c)b.classList.add('right');else if(b.dataset.l===l)b.classList.add('wrong')});
  card.insertAdjacentHTML('beforeend',fbHtml(q,l));qStats()}
function qStats(){
  const t=D.qs.length,n=Object.keys(S.ans).length,ok=D.qs.filter(q=>S.ans[q.n]===q.c).length,p=Math.round(n/t*100);
  $('#qp-t').textContent=`${n} / ${t} respondidas`;$('#qp-p').textContent=p+'%';$('#qp-b').style.width=p+'%';
  $('#n-ok').textContent=ok;$('#n-no').textContent=n-ok;$('#n-pct').textContent=n?`${Math.round(ok/n*100)}% de acerto`:'—';
  const r=$('#result');
  if(n===t){const rows=Object.keys(AN).map(k=>{const g=D.qs.filter(q=>String(q.a)===k),c=g.filter(q=>S.ans[q.n]===q.c).length,pc=Math.round(c/g.length*100);return `<div class="row"><span>${AN[k]}</span><div class="bar"><i style="width:${pc}%"></i></div><span>${c}/${g.length}</span></div>`}).join('');
    r.style.display='block';r.innerHTML=`<div class="big">${Math.round(ok/t*100)}%</div><h2>Simulado concluído!</h2><p style="color:var(--dim)">Você acertou ${ok} de ${t}. Revise as aulas com menor desempenho:</p><div style="text-align:left;max-width:460px;margin:auto">${rows}</div><p><button class="btn p" id="errs">Revisar só os erros</button></p>`;
    $('#errs').onclick=()=>{$('#status').value='err';renderQ();scrollTo({top:0})}}
  else r.style.display='none';
}
$('#qchips').innerHTML='<button class="chip on" data-a="all">Todas</button>'+Object.keys(AN).map(k=>`<button class="chip" data-a="${k}">${AN[k]}</button>`).join('');
$$('#qchips .chip').forEach(c=>c.onclick=()=>{fa=c.dataset.a;$$('#qchips .chip').forEach(x=>x.classList.toggle('on',x===c));renderQ()});
$('#status').onchange=renderQ;
$('#shuf').checked=S.shuf;$('#shuf').onchange=e=>{S.shuf=e.target.checked;save();renderQ()};
$('#reset').onclick=()=>{if(!confirm('Apagar todas as respostas e recomeçar?'))return;S.ans={};S.seed=(Math.random()*1e6)|0;save();$('#status').value='all';renderQ();scrollTo({top:0})};

/* topo */
addEventListener('scroll',()=>{$('#top').style.display=scrollY>600?'block':'none'},{passive:true});
$('#top').onclick=()=>scrollTo({top:0});

renderAulas();renderQ();
</script>
</body>
</html>
