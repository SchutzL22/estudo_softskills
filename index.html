<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>Soft Skills — Guia de Estudo</title>
<style>
:root{--bg:#0d1424;--bg2:#131c33;--card:#161f3a;--line:#263256;--text:#eaf0ff;--dim:#9ba8cf;--acc:#6c9bff;--acc2:#5fe0c8;--warn:#ffb454;--ok:#3ddc97;--okbg:rgba(61,220,151,.13);--bad:#ff6b81;--badbg:rgba(255,107,129,.13);--on:#0b1020;--r:16px}
:root[data-theme=light]{--bg:#f3f6fd;--bg2:#e9eefb;--card:#fff;--line:#d5ddf0;--text:#141c33;--dim:#5b6890;--acc:#3b6ef0;--acc2:#0f9d86;--warn:#b86e00;--ok:#0f8a5a;--okbg:rgba(15,138,90,.1);--bad:#d13450;--badbg:rgba(209,52,80,.09);--on:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 500px at 0 -10%,rgba(108,155,255,.16),transparent 60%),radial-gradient(800px 400px at 100% 0,rgba(95,224,200,.1),transparent 55%),var(--bg);color:var(--text);line-height:1.55;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.top{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:clamp(16px,4.2vw,22px);flex:1;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.icon{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:17px}
.tabs{max-width:900px;margin:10px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-weight:700;font-size:14px;cursor:pointer}
.tab.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:var(--on);border-color:transparent}
main{max-width:900px;margin:0 auto;padding:16px 14px}
.panel{display:none}.panel.on{display:block;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.btn{padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--acc)}.btn.p{background:var(--acc);color:var(--on);border-color:transparent}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--on);border-color:transparent}
input[type=search],select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
.bar{height:8px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:5px}
/* estudo */
.aula{margin-bottom:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.aula>summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;gap:12px;align-items:center}.aula>summary::-webkit-details-marker{display:none}
.badge{flex:none;min-width:44px;padding:5px 9px;border-radius:9px;background:rgba(108,155,255,.15);color:var(--acc);font-weight:800;font-size:12px;text-align:center;border:1px solid rgba(108,155,255,.3)}
.aula h2{margin:0;font-size:16px;flex:1;line-height:1.3}.chev{transition:.2s;color:var(--dim)}.aula[open] .chev{transform:rotate(90deg)}
.body{padding:0 16px 16px}
.sec{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.sec h3{margin:0 0 8px;font-size:15px;color:var(--acc2)}
.sec p,.sec li{margin:0 0 8px;font-size:15px}.sec ul{margin:0;padding-left:20px}
.sec b.l{color:var(--text);background:rgba(108,155,255,.13);padding:1px 6px;border-radius:6px;font-weight:700}
.call{margin:8px 0;padding:10px 13px;border-radius:12px;background:rgba(255,180,84,.12);border-left:4px solid var(--warn);font-size:14.5px}.call b{color:var(--warn)}
.done{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--dim);cursor:pointer}.done input{width:18px;height:18px;accent-color:var(--acc2)}
.hl{background:rgba(255,220,80,.35);color:inherit;border-radius:3px}
.quick li{list-style:none;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}.quick{padding:0;margin:0}
.quick b{color:var(--acc)}
.frase{font-weight:700;font-size:15px;line-height:1.6;border-left:4px solid var(--acc2);padding-left:12px}
/* questões */
.q{scroll-margin-top:150px}
.qh{display:flex;gap:10px;margin-bottom:12px}.qn{flex:none;width:32px;height:32px;border-radius:9px;background:rgba(108,155,255,.15);color:var(--acc2);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(108,155,255,.3)}
.qt{font-weight:600;font-size:15.5px}.tag{display:inline-block;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-bottom:4px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);text-align:left;font:inherit;font-size:14.5px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--acc);background:rgba(108,155,255,.07)}.opt:disabled{cursor:default;opacity:1}
.lt{flex:none;width:24px;height:24px;border-radius:7px;background:var(--bg2);border:1px solid var(--line);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .lt{background:var(--ok);color:var(--on);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong .lt{background:var(--bad);color:var(--on);border-color:var(--bad)}
.fb{display:none;margin-top:12px;padding:11px 13px;border-radius:12px;font-size:14px}.fb.show{display:block}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.no{background:var(--badbg);border:1px solid var(--bad)}.fb b{display:block;margin-bottom:3px}
.stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.pill{padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700}
.opts2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 14px;font-size:13.5px;color:var(--dim)}.opts2 label{display:flex;gap:6px;align-items:center;cursor:pointer}.opts2 select{width:auto;padding:8px 10px;font-size:13px}
.res h2{margin:0 0 4px}.big{font-size:44px;font-weight:900;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;align-items:center;gap:10px;font-size:13px;margin:6px 0}.row span:first-child{width:96px;flex:none;color:var(--dim)}.row .bar{flex:1}.row span:last-child{width:52px;text-align:right;flex:none}
.empty{text-align:center;color:var(--dim);padding:30px 10px}
#top{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:none;background:var(--acc);color:var(--on);font-size:20px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);display:none}
@media(max-width:520px){.card{padding:14px}.qt{font-size:15px}.aula>summary{padding:13px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>🧠 Soft Skills — Guia de Estudo</h1><button class="icon" id="theme" aria-label="Alternar tema">🌓</button></div>
  <div class="tabs" role="tablist"><button class="tab on" data-t="estudo">📖 Estudo</button><button class="tab" data-t="quest">✅ Questões</button></div>
</header>
<main>
<section id="estudo" class="panel on">
  <div class="card">
    <div class="meta"><span id="sp-t">0 de 0 aulas revisadas</span><span id="sp-p">0%</span></div>
    <div class="bar"><i id="sp-b"></i></div>
    <input type="search" id="busca" placeholder="🔍 Buscar termo (ex.: feedback, Hawthorne, Rogers)…" style="margin-top:12px">
  </div>
  <div class="chips" id="aulachips"></div>
  <div id="aulas"></div>
  <details class="aula" id="resumao"><summary><span class="badge">⚡</span><h2>Resumão geral — revisão de minutos antes da prova</h2><span class="chev">▶</span></summary><div class="body"><p class="frase" id="frase"></p><ul class="quick" id="rlist"></ul></div></details>
  <details class="aula" id="macetes"><summary><span class="badge">💡</span><h2>Macetes finais para a prova</h2><span class="chev">▶</span></summary><div class="body"><ul class="quick" id="mlist"></ul></div></details>
</section>

<section id="quest" class="panel">
  <div class="card">
    <div class="meta"><span id="qp-t">0 / 0 respondidas</span><span id="qp-p">0%</span></div>
    <div class="bar"><i id="qp-b"></i></div>
    <div class="stats" style="margin:12px 0 0"><span class="pill">✅ <span id="n-ok">0</span></span><span class="pill">❌ <span id="n-no">0</span></span><span class="pill" id="n-pct">—</span><button class="btn" id="reset" style="margin-left:auto">🔄 Reiniciar</button></div>
  </div>
  <div class="chips" id="qchips"></div>
  <div class="opts2">
    <select id="status" aria-label="Filtro de status"><option value="all">Todas</option><option value="open">Não respondidas</option><option value="err">Só as que errei</option></select>
    <label><input type="checkbox" id="shuf" checked> Embaralhar alternativas</label>
  </div>
  <div id="qlist"></div>
  <div class="card res" id="result" style="display:none;text-align:center"></div>
</section>
</main>
<button id="top" aria-label="Voltar ao topo">↑</button>

<script>
const D={"aulas": [{"id": 1, "title": "Soft Skills, Habilidades Sociais e Competência Social", "secs": [{"title": "Por que estudar competências socioemocionais?", "items": [{"t": "p", "text": "há digitalização acelerada, trabalho presencial/híbrido/remoto, diversidade cultural e migração, plataformização, automação e conectividade permanente. Em um cenário rápido e de mudanças imprevisíveis, a educação precisa ser pensada ao longo da vida.", "label": "O trabalho mudou"}]}, {"title": "Habilidades sociais (HS)", "items": [{"t": "p", "text": "Habilidades sociais são comportamentos valorizados socialmente, apresentados diante de demandas de uma situação interpessoal. Como campo teórico, estudam estratégias e comportamentos que favorecem interações humanas bem-sucedidas, bem-estar e proteção da saúde mental."}, {"t": "call", "label": "Importante", "text": "as habilidades sociais devem ter alta probabilidade de produzir resultados favoráveis para o indivíduo, seu grupo e sua comunidade. Elas também variam de acordo com a cultura."}]}, {"title": "Comportamentos desejáveis x indesejáveis", "items": [{"t": "p", "text": "manifestar respeito e empatia, expressar opiniões e sentimentos, fazer/aceitar/rejeitar críticas, falar em público, fazer amizades e abordar autoridades.", "label": "Comportamentos desejáveis incluem"}, {"t": "p", "text": "agressividade, como agredir, coagir, manipular, desrespeitar e enganar.", "label": "Indesejáveis ativos"}, {"t": "p", "text": "passividade, como isolar-se, omitir-se, autodepreciar-se e submeter-se.", "label": "Indesejáveis passivos"}, {"t": "call", "label": "Atenção", "text": "desejáveis e indesejáveis são comportamentos concorrentes. Ambos podem se manter porque produzem consequências positivas ou evitam consequências negativas para a pessoa."}]}, {"title": "Competência social", "items": [{"t": "p", "text": "É o componente avaliativo do desempenho social. Avalia se o comportamento emitido é adequado para a própria pessoa e para quem interage com ela, considerando a cultura."}, {"t": "p", "text": "Para ser socialmente competente, não basta funcionar/atingir objetivos. Também é necessário respeitar critérios éticos e os direitos humanos."}, {"t": "p", "text": "nem considerar apenas a si mesmo, nem colocar sempre os outros acima de si; o equilíbrio é considerar a si mesmo e também aos demais.", "label": "Regra de ouro de Joseph Wolpe"}]}, {"title": "Por que as HS importam?", "items": [{"t": "p", "text": "Elas são a via de expressão e desenvolvimento de outras competências; facilitam a inserção profissional; relacionam-se ao desempenho acadêmico; estão associadas à saúde no trabalho, maior rendimento e menor estresse ocupacional; e relacionam-se ao bem-estar, afetos positivos, autoestima e controle do ambiente."}]}, {"title": "Realidade psíquica", "items": [{"t": "p", "text": "A realidade psíquica é elaborada pelas pessoas a partir do que é armazenado na mente. Não é um reflexo perfeitamente fiel do mundo. Cada pessoa pode elaborar uma realidade psíquica própria, influenciada pelo modo como registra e interpreta estímulos."}]}]}, {"id": 2, "title": "Comportamento Humano nas Organizações", "secs": [{"title": "O que é comportamento?", "items": [{"t": "p", "text": "Comportamento é a interação entre aquilo que o organismo faz e os aspectos do ambiente em que se encontra."}, {"t": "p", "text": "O comportamento só pode ser compreendido funcionalmente quando conhecemos o contexto. Olhar somente para a resposta pode levar a uma interpretação equivocada."}]}, {"title": "Mesmo comportamento, funções diferentes", "items": [{"t": "p", "text": "um aluno calado pode estar em silêncio porque tem medo/está evitando uma punição, ou porque está fazendo uma atividade de leitura silenciosa. A resposta é parecida, mas a função pode ser diferente.", "label": "Exemplo"}]}, {"title": "Tríplice contingência", "items": [{"t": "p", "text": "Sd → R → Sr"}, {"t": "p", "text": "situação que antecede o comportamento.", "label": "Sd = estímulo antecedente"}, {"t": "p", "text": "comportamento emitido.", "label": "R = resposta"}, {"t": "p", "text": "aquilo que ocorre depois e participa da manutenção/modificação do comportamento.", "label": "Sr = estímulo consequente"}, {"t": "p", "text": "colega abatido e dizendo que não dará conta do projeto (Sd); profissional se aproxima com postura aberta, contato visual e fala empática (R); colega relaxa, fala das dificuldades, agradece e depois busca novamente a interação (Sr).", "label": "Exemplo dos slides"}]}, {"title": "Multideterminação causal", "items": [{"t": "p", "text": "O comportamento humano é influenciado por vários fatores. Por isso, analisar apenas “o que a pessoa fez” é insuficiente."}]}, {"title": "Determinantes do comportamento", "items": [{"t": "p", "text": "características herdadas geneticamente, ligadas à história evolutiva da espécie.", "label": "Filogenéticos"}, {"t": "p", "text": "história individual de aprendizagem, experiências e contingências de reforço/punição ao longo da vida.", "label": "Ontogenéticos"}, {"t": "p", "text": "práticas e contingências sociais compartilhadas por um grupo.", "label": "Culturais"}, {"t": "p", "text": "O modelo bioecológico reforça que o comportamento está inserido em múltiplos níveis de contexto."}]}, {"title": "Behaviorismo radical no trabalho", "items": [{"t": "p", "text": "O comportamento é função das contingências de reforço e punição presentes no ambiente. Nos slides, estresse, desmotivação e burnout são apresentados como efeitos de contingências aversivas e da ausência de reforços positivos, e não como causas isoladas."}]}, {"title": "Organização e comportamento organizacional", "items": [{"t": "p", "text": "pessoas numa atividade/espaço comum sem necessariamente existir interação, vínculo ou objetivo comum.", "label": "Agrupamento"}, {"t": "p", "text": "pessoas que interagem ao longo do tempo, compartilham identidade/vínculos e estabelecem normas.", "label": "Grupo"}, {"t": "p", "text": "grupos de pessoas que trabalham de maneira interdependente e com objetivos previamente delineados.", "label": "Organização"}, {"t": "p", "text": "campo que busca prever, explicar e compreender o comportamento humano nas organizações. Considera comportamentos observáveis, ações interiores como pensar/perceber/decidir, pessoas individualmente, grupos e fenômenos que emergem da dinâmica grupal.", "label": "Comportamento organizacional"}]}, {"title": "Fenômenos psicossociais no trabalho", "items": [{"t": "p", "text": "pode favorecer preferências por singularidade ou conformidade.", "label": "Cultura"}, {"t": "p", "text": "ajustar opinião/comportamento à posição do grupo.", "label": "Conformidade social"}, {"t": "p", "text": "regra compartilhada e sustentada socialmente, podendo ser informal.", "label": "Norma social"}, {"t": "p", "text": "rivalidade entre grupos que prejudica a cooperação.", "label": "Conflito intergrupal"}]}]}, {"id": 3, "title": "Grupos e Equipes de Trabalho", "secs": [{"title": "Por que estudar grupos?", "items": [{"t": "p", "text": "Vivemos em grupos desde o nascimento, e os grupos moldam continuamente nosso comportamento. No trabalho, equipes são importantes unidades de desempenho."}]}, {"title": "Agrupamento, grupo e equipe", "items": [{"t": "p", "text": "pessoas juntas, sem necessariamente interação, vínculo ou objetivo comum.", "label": "Agrupamento"}, {"t": "p", "text": "pessoas que interagem, estabelecem vínculos e normas e reconhecem pertencimento e/ou objetivos compartilhados.", "label": "Grupo"}, {"t": "p", "text": "grupo organizado em torno de objetivos comuns, com papéis articulados, interdependência e responsabilidade compartilhada pelos resultados.", "label": "Equipe"}]}, {"title": "Quando um conjunto se torna mais grupo?", "items": [{"t": "p", "text": "há menor número de integrantes; maior interação; maior história compartilhada; e perspectiva de futuro partilhado mais clara.", "label": "Tende a ser mais grupo quando"}]}, {"title": "Grupo de referência", "items": [{"t": "p", "text": "É aquele em relação ao qual o indivíduo se sente motivado a manter relações. Quando um grupo de relações se torna grupo de referência, ele passa a ter papel normativo no comportamento do indivíduo."}]}, {"title": "Normas grupais", "items": [{"t": "p", "text": "São frequentemente implícitas, mas podem ser seguidas com rigor. Pertencer ao grupo implica lidar com suas regras. Aceitação e prestígio podem funcionar como recompensas; admoestações e exclusão, como punições."}]}, {"title": "Poder e influência", "items": [{"t": "p", "text": "diante de objetos sociais ambíguos, as pessoas podem apoiar-se no julgamento dos outros para reduzir incerteza e formar uma norma comum.", "label": "Moscovici"}, {"t": "p", "text": "Maioria e minoria, no sentido apresentado na aula, relacionam-se ao poder, não simplesmente ao número de pessoas."}, {"t": "p", "text": "quanto mais central e identificado com o grupo, mais resistente à mudança. Membros periféricos tendem a ser mais flexíveis.", "label": "Núcleo central de poder"}, {"t": "p", "text": "O organograma formal nem sempre traduz as relações reais de poder."}, {"t": "p", "text": "Mudanças podem produzir ansiedade e respostas negativas quando não existe sensibilização do grupo."}]}, {"title": "Hawthorne", "items": [{"t": "p", "text": "A Experiência de Hawthorne ocorreu na Western Electric Company, com Elton Mayo/Harvard, entre 1927 e 1933."}, {"t": "p", "text": "melhor iluminação aumentaria a produtividade.", "label": "Hipótese inicial"}, {"t": "p", "text": "a produtividade aumentava independentemente da iluminação.", "label": "Resultado-surpresa"}, {"t": "p", "text": "fatores psicológicos, como sentir-se importante e participar da pesquisa, tinham forte impacto.", "label": "Nova hipótese"}, {"t": "p", "text": "grupo pequeno + objetivo comum + sentimento de pertencimento podem favorecer produtividade e satisfação.", "label": "Conclusão apresentada"}, {"t": "p", "text": "Escola das Relações Humanas e influência sobre práticas modernas de gestão de pessoas.", "label": "Legado"}]}, {"title": "Comunicação e liderança em grupos", "items": [{"t": "p", "text": "A comunicação grupal é condição fundamental para o funcionamento dos grupos. A recepção de uma mensagem não é pura: cada receptor pode reinterpretá-la à sua maneira."}, {"t": "p", "text": "A liderança é sempre um fenômeno grupal. O líder não é necessariamente o mais inteligente ou o mais carismático, mas aquele que melhor sintetiza as aspirações do grupo. Liderar envolve conjugar objetivos e aspirações dos envolvidos com metas organizacionais. Ouvir é tão importante quanto falar."}]}, {"title": "Equipes de trabalho", "items": [{"t": "p", "text": "identidade coletiva, interdependência, meta compartilhada e autonomia.", "label": "Atributos centrais"}, {"t": "p", "text": "Grupos x equipes:"}, {"t": "li", "text": "esforço mais individualizado; responsabilidade mais individual; metas mais individualizadas; autonomia mais dependente da organização; liderança mais designada externamente.", "label": "Grupos"}, {"t": "li", "text": "esforço prioritariamente coletivo; responsabilidade compartilhada pelos resultados globais; meta compartilhada; autonomia semiautônoma/autônoma; liderança mais compartilhada e prestação de contas à própria equipe.", "label": "Equipes"}, {"t": "p", "text": "A diferença entre grupo e equipe não é simplesmente presença/ausência de um atributo, mas a INTENSIDADE com que ele se manifesta."}]}, {"title": "Mitos sobre equipes", "items": [{"t": "p", "text": "equipes são sempre mais eficazes que indivíduos.", "label": "Mito 1"}, {"t": "p", "text": "trabalhar em equipe sempre gera mais satisfação.", "label": "Mito 2"}, {"t": "p", "text": "maior coesão sempre significa maior efetividade.", "label": "Mito 3"}, {"t": "p", "text": "maior interdependência sempre significa maior efetividade.", "label": "Mito 4"}, {"t": "p", "text": "Os slides desconstruem todos eles. Equipes não são automaticamente melhores; satisfação depende de fatores como crenças sobre trabalho em equipe; coesão pode direcionar esforços para metas pessoais; e interdependência tem efeitos complexos e condicionados a outras variáveis."}]}, {"title": "Estágios de desenvolvimento", "items": [{"t": "li", "text": "membros se conhecem; há incerteza sobre papéis, normas e responsabilidades.", "label": "Formação"}, {"t": "li", "text": "negociação sobre quem faz o quê; lideranças começam a surgir; é preciso LIDAR com o conflito.", "label": "Conflito"}, {"t": "li", "text": "coesão e identificação aumentam; papéis, tarefas e estratégias são aceitos/definidos.", "label": "Normatização"}, {"t": "li", "text": "energia voltada para a tarefa; máxima produtividade.", "label": "Desempenho"}, {"t": "li", "text": "equipes temporárias se dissolvem após o objetivo; permanentes encerram um ciclo e iniciam outro.", "label": "Desintegração"}, {"t": "p", "text": "As fases não precisam seguir uma sequência rígida; interferências internas e externas podem provocar regressão."}]}, {"title": "Efetividade de equipes", "items": [{"t": "p", "text": "Para uma equipe ser efetiva, os slides destacam três indicadores simultâneos:"}, {"t": "li", "text": "atingir ou superar padrões organizacionais de quantidade, qualidade e temporalidade.", "label": "Resultados produtivos"}, {"t": "li", "text": "a experiência deve atender necessidades individuais sem padrões destrutivos que prejudiquem o bem-estar.", "label": "Satisfação dos membros"}, {"t": "li", "text": "processos sociais devem favorecer a manutenção da equipe; elevada rotatividade ou absenteísmo sinalizam baixa probabilidade de efetividade de longo prazo.", "label": "Sobrevivência da equipe"}, {"t": "p", "text": "Uma equipe pode ser muito produtiva e ainda assim não ser considerada efetiva se houver elevada insatisfação dos membros."}]}, {"title": "Como tornar equipes efetivas?", "items": [{"t": "p", "text": "Não existe receita única. Os slides destacam tamanho e competências adequados, autonomia e suporte, recompensas individuais e coletivas e feedback periódico."}]}, {"title": "Complemento: Arquitetura da Colaboração", "items": [{"t": "p", "text": "O material adicional reforça a ideia de espectro da grupalidade: um conjunto não é simplesmente “grupo” ou “não grupo”; ele se torna mais grupo conforme aumenta a intensidade de quatro condições: número reduzido de integrantes, interação entre membros, extensão da história compartilhada e clareza da perspectiva de futuro partilhado. O material usa como contraste pessoas no ponto de ônibus (baixa intensidade) e amigos jogando futebol aos sábados (alta intensidade)."}, {"t": "p", "text": "A “anatomia” de uma equipe é sintetizada em quatro peças: identidade coletiva, interdependência, meta compartilhada e autonomia. Interdependência significa que o êxito da meta exige contribuição e interação de todos. Meta compartilhada significa um objetivo global, indivisível e atribuído ao coletivo. Autonomia significa atuação semiautônoma na tomada de decisão e nos procedimentos."}, {"t": "p", "text": "liderança não existe isoladamente, mas no contexto social. O papel do líder é conjugar as aspirações internas do grupo com as metas organizacionais. Ouvir o grupo é tão estratégico quanto falar e direcionar.", "label": "O líder aparece como “sintetizador”"}, {"t": "p", "text": "interferências internas ou externas podem provocar regressão de estágios. Na fase de conflito, o conflito não deve ser eliminado prematuramente; deve ser gerenciado para construir alinhamento. A desintegração não é necessariamente uma falha: pode representar a conclusão arquitetônica do projeto. Em equipes temporárias, atingir integralmente a meta pode levar à dissolução e realocação dos indivíduos; em equipes permanentes, encerra-se um grande ciclo e começa outro.", "label": "O desenvolvimento da equipe é não linear"}, {"t": "p", "text": "Para a efetividade, o material gráfico organiza quatro elementos de gestão como “motor”: 1) tamanho e competências adequados à tarefa; 2) autonomia e suporte social/material; 3) recompensas individuais e coletivas; 4) feedback periódico, oportuno e baseado em métricas claras para correção de rota."}]}]}, {"id": 4, "title": "Diversidade, Inclusão e Segurança Psicológica", "secs": [{"title": "Diversidade", "items": [{"t": "p", "text": "É a diferença entre as pessoas, podendo envolver raça, etnia, gênero, orientação sexual, linguagem, cultura, religião, habilidades mentais e físicas, classe e situação migratória."}]}, {"title": "Inclusão", "items": [{"t": "p", "text": "É um processo que ajuda a superar barreiras que limitam presença, participação e desempenho."}, {"t": "p", "text": "“O problema não é apenas entrar, é poder participar.”", "label": "Fórmula importante"}]}, {"title": "Peso das normas sociais", "items": [{"t": "p", "text": "A norma não aparece apenas como uma regra que proíbe. Nos slides, aparece como um padrão a partir do qual pessoas e corpos são comparados, classificados e hierarquizados."}, {"t": "p", "text": "A norma pode fabricar a ideia do “profissional adequado”: boa aparência, postura de liderança, comunicação adequada, disponibilidade total e controle emocional. Quem não se encaixa tende a ser silenciado."}]}, {"title": "Quando a diferença vira desigualdade", "items": [{"t": "p", "text": "A sequência trabalhada é:"}, {"t": "p", "text": "Diferença → norma dominante → hierarquia → efeito/exclusão."}, {"t": "p", "text": "raça, gênero, deficiência, idade, classe, sexualidade, religião e território.", "label": "Marcadores citados"}, {"t": "p", "text": "A diferença não causa automaticamente a exclusão. Ela é interpretada por relações históricas de poder."}]}, {"title": "Desnaturalizar", "items": [{"t": "p", "text": "quem definiu? Que saber legitimou? Quem se beneficia? Quando surgiu? Quem reproduz? Que efeitos produz?", "label": "Perguntas centrais"}]}, {"title": "Estereótipo, preconceito e discriminação", "items": [{"t": "p", "text": "Estereótipo = componente cognitivo; crença simplificada e generalizada sobre um grupo, construída socialmente. Pode facilitar uma compreensão rápida do mundo social, mas também levar a julgamentos injustos."}, {"t": "p", "text": "Preconceito = componente afetivo/atitude; atitude negativa em relação a um grupo, compreendida como predisposição aprendida e socialmente orientada."}, {"t": "p", "text": "Discriminação = componente comportamental/ação; relaciona-se ao que é efetivamente feito e pode ser institucionalizada em sistemas de opressão."}, {"t": "call", "label": "Memorização", "text": "ESTEREÓTIPO = penso/creio; PRECONCEITO = sinto/avalio; DISCRIMINAÇÃO = ajo."}]}, {"title": "Componentes das atitudes", "items": [{"t": "p", "text": "componente afetivo (emoções e sentimentos), cognitivo (crenças) e comportamental (intenções comportamentais), em relação a um objeto social.", "label": "Os slides apresentam"}]}, {"title": "Racismo estrutural e branquitude", "items": [{"t": "p", "text": "Nos slides, o racismo estrutural é apresentado como sistema que fornece sentido, lógica e tecnologia para a reprodução de desigualdades e violências; mantém hierarquias, justifica privilégios e naturaliza desigualdades."}, {"t": "p", "text": "Branquitude é apresentada como lugar simbólico de privilégio racial, econômico, político e subjetivo, relacionado a posições sociais e não apenas ao fenótipo."}, {"t": "p", "text": "Pactos narcísicos, conforme Cida Bento na aula, são alianças conscientes e inconscientes que, no tocante ao racismo, envolvem negação do problema racial, silenciamento e interdição de negros em espaços de poder, entre outros efeitos de exclusão."}]}, {"title": "Segurança psicológica", "items": [{"t": "p", "text": "Em um ambiente psicologicamente seguro, pessoas podem falar o que pensam e agir com autenticidade sem medo de serem rejeitadas, sendo seguro vivenciar riscos interpessoais."}, {"t": "p", "text": "Segurança psicológica NÃO significa ausência de conflito, redução de exigência ou garantia de concordância."}, {"t": "p", "text": "Ela é liberdade para assumir risco interpessoal, por exemplo: perguntar, discordar, admitir um erro, pedir ajuda e apresentar uma preocupação."}]}, {"title": "Três condições de segurança psicológica", "items": [{"t": "p", "text": "compreender o mundo a partir do referencial interno do outro.", "label": "Empatia"}, {"t": "p", "text": "reconhecer a dignidade do outro sem impor condicionantes.", "label": "Aceitação positiva"}, {"t": "p", "text": "agir com autenticidade e coerência entre fala e prática.", "label": "Congruência"}]}, {"title": "Carl Rogers", "items": [{"t": "p", "text": "necessidade humana de ser considerado por pessoas socialmente significativas.", "label": "Consideração positiva"}, {"t": "p", "text": "existe condição para receber consideração; nos slides, isso é associado a comprometimento da autoestima, deslocamento do centro de referência para o externo e maior distância do self real.", "label": "Consideração positiva condicional"}, {"t": "p", "text": "aceitar a pessoa como ela é.", "label": "Consideração positiva incondicional"}, {"t": "p", "text": "“Tornar-se pessoa” é apresentado como processo, não estado final: aproximar-se de quem realmente se é, com aceitação, autenticidade e abertura para mudança/crescimento."}]}, {"title": "Da escuta à ação", "items": [{"t": "p", "text": "Construção de ambiente seguro:"}, {"t": "li", "text": "normas, hierarquias, silêncios e distribuição do poder.", "label": "Tornar visível"}, {"t": "li", "text": "empatia, consideração positiva e congruência.", "label": "Escutar com qualidade"}, {"t": "li", "text": "processos, critérios, reparação e responsabilização.", "label": "Transformar a prática"}, {"t": "p", "text": "Em relatos de discriminação, o exemplo dos slides segue: acolher sem invalidar → proteger contra retaliação → investigar → responder com critérios → reparar efeitos."}]}, {"title": "Cinco princípios de uma organização inclusiva", "items": [{"t": "li", "text": "Toda norma deve poder ser questionada."}, {"t": "li", "text": "Nenhuma diferença justifica menor dignidade."}, {"t": "li", "text": "Toda voz precisa de condições reais de expressão."}, {"t": "li", "text": "Escutar implica responder."}, {"t": "li", "text": "Incluir e responsabilizar são ações complementares."}, {"t": "call", "label": "Frase-chave", "text": "incluir não é adaptar pessoas a uma norma intacta."}]}]}, {"id": 5, "title": "Comunicação e Processos Psicológicos", "secs": [{"title": "O que é comunicação?", "items": [{"t": "p", "text": "É a transmissão e recepção de mensagens entre transmissor e receptor por linguagem oral, escrita ou gestual, usando sistemas convencionados de signos e símbolos."}, {"t": "p", "text": "transferência e compreensão de significado entre pessoas.", "label": "Outra definição do slide"}, {"t": "p", "text": "Comunicar não é apenas transmitir. O significado precisa ser transmitido e compreendido pelo receptor. A aula apresenta “comunicação perfeita” quando a imagem mental do receptor é idêntica à do emissor."}]}, {"title": "Comunicação e conflitos", "items": [{"t": "p", "text": "Nos slides, a comunicação deficiente é apresentada como principal fonte de conflitos interpessoais no trabalho."}]}, {"title": "Comunicação e construção da realidade", "items": [{"t": "p", "text": "A comunicação participa da construção da consciência humana, da linguagem, do pensamento e da realidade cotidiana. Na organização, “nada existe fora da comunicação”, segundo a formulação apresentada na aula."}]}, {"title": "Realidade psíquica", "items": [{"t": "p", "text": "É construída pelo modo como cada pessoa registra e interpreta os estímulos. O mesmo evento objetivo pode gerar realidades psíquicas distintas."}]}, {"title": "Sensação x percepção", "items": [{"t": "p", "text": "Sensação = operação pela qual informações do mundo exterior chegam ao cérebro."}, {"t": "p", "text": "Percepção = interpretação da imagem recebida, mediada por experiências anteriores, crenças, estado emocional e contexto."}]}, {"title": "Limiar inferior e superior", "items": [{"t": "p", "text": "Limiar inferior = nível mínimo de estímulo reconhecível; abaixo dele, a informação é ignorada."}, {"t": "p", "text": "Limiar superior = acima de determinado nível podem ocorrer danos ou saturação/bloqueio da sensação."}]}, {"title": "Fatores que afetam a percepção", "items": [{"t": "li", "text": "Captura visual."}, {"t": "li", "text": "Experiências anteriores."}, {"t": "li", "text": "Conhecimentos do indivíduo."}, {"t": "li", "text": "Crenças e valores."}, {"t": "li", "text": "Emoções e expectativas."}, {"t": "li", "text": "Variável situacional."}, {"t": "p", "text": "O mesmo conjunto de estímulos pode gerar percepções diferentes em pessoas diferentes."}]}, {"title": "Fenômenos perceptivos", "items": [{"t": "p", "text": "o cérebro seleciona uma porção como figura e o restante como fundo.", "label": "Figura-fundo"}, {"t": "p", "text": "interpretação errônea de estímulos reais.", "label": "Ilusão perceptiva"}, {"t": "p", "text": "estímulos abaixo do limiar consciente ainda podem influenciar comportamentos.", "label": "Percepção subliminar"}]}, {"title": "Atenção", "items": [{"t": "p", "text": "É o processo que seleciona/descarta estímulos que chegam ao cérebro."}, {"t": "p", "text": "Tudo que modifica a situação chama a atenção."}, {"t": "p", "text": "intensidade, novidade e repetição.", "label": "Fatores externos"}, {"t": "p", "text": "necessidades, objetivos e motivações.", "label": "Fatores internos"}, {"t": "p", "text": "Falta de atenção pode estar ligada a mecanismos de defesa, hiperfoco em outra atividade ou incapacidade de compreender o conteúdo."}]}, {"title": "Memória", "items": [{"t": "p", "text": "É a capacidade de registrar informações. Uma lembrança muito vívida não prova que o fato realmente aconteceu daquela forma."}, {"t": "p", "text": "A memória é reconstrutora, podendo sofrer distorções na codificação ou armazenamento."}, {"t": "p", "text": "Fenômenos apresentados:"}, {"t": "li", "text": "Reconstrução."}, {"t": "li", "text": "lembrar o ruim muito pior e o bom muito melhor.", "label": "Ampliação de atributos"}, {"t": "li", "text": "preencher lacunas com suposições plausíveis.", "label": "Falsas lembranças"}, {"t": "li", "text": "preencher lacunas com aparente lógica, sem vínculo com a realidade.", "label": "Confabulação"}, {"t": "li", "text": "perguntas sugestivas podem influenciar lembranças.", "label": "Indução de falsas lembranças"}, {"t": "li", "text": "conteúdos em contexto emocional positivo tendem a ser retidos com mais facilidade; ansiedade e medo podem bloquear.", "label": "Memória e emoção"}]}, {"title": "Linguagem e pensamento", "items": [{"t": "p", "text": "atividade mental relacionada a raciocinar, resolver problemas e formar conceitos.", "label": "Pensamento"}, {"t": "p", "text": "possibilita representar o mundo e expressar ideias, emoções e pensamentos.", "label": "Linguagem"}, {"t": "p", "text": "Pensamentos são limitados por esquemas mentais já estabelecidos, o que pode levar a aplicar soluções antigas em situações novas e formar vieses."}, {"t": "p", "text": "A linguagem influencia o que se pensa, e diferenças grandes de linguagem/pensamento entre partes podem aumentar incompatibilidades e conflitos."}, {"t": "p", "text": "sensório-motor → pré-operacional → operatório-concreto → operações formais.", "label": "Piaget"}, {"t": "p", "text": "Nos slides, aprender exige adaptar linguagem e conteúdo ao estágio de desenvolvimento."}]}, {"title": "Emoção", "items": [{"t": "p", "text": "A emoção é apresentada como complexo estado de sentimentos com componentes somáticos, psíquicos e comportamentais, relacionados ao afeto e humor."}, {"t": "p", "text": "a emoção delimita o campo de ação e conduz a razão; sem emoção não é possível tomar decisões. A razão atua sobre o conjunto de opções disponibilizado pela emoção.", "label": "Nos slides"}, {"t": "p", "text": "Efeitos destacados:"}, {"t": "p", "text": "pode inibir novas ideias, aumentar alerta, produzir bloqueio/submissão.", "label": "Medo"}, {"t": "p", "text": "pode gerar condutas inadequadas, distorcer percepção e memória e produzir pensamentos obsessivos.", "label": "Raiva"}, {"t": "p", "text": "estreita o campo atencional, compromete recuperação de memórias e prejudica o raciocínio lógico.", "label": "Ansiedade"}, {"t": "p", "text": "pode conduzir a comportamentos agressivos e excludentes.", "label": "Inveja"}, {"t": "p", "text": "amplia percepção, estimula memória e flexibiliza esquemas de pensamento.", "label": "Alegria"}, {"t": "p", "text": "felicidade, surpresa, raiva, tristeza, medo e repugnância.", "label": "Emoções básicas citadas"}, {"t": "p", "text": "vergonha, culpa, orgulho, inveja e embaraço.", "label": "Emoções sociais citadas"}]}]}, {"id": 7, "title": "Habilidades Sociais na Comunicação", "secs": [{"title": "Classes importantes de HS", "items": [{"t": "p", "text": "Empatia; assertividade; escuta ativa; comunicação eficaz; civilidade; solução de problemas interpessoais; cooperação e respeito; autocontrole emocional."}]}, {"title": "Comunicação corporal e paralinguística (CCP)", "items": [{"t": "p", "text": "Comunicação eficaz não depende apenas do conteúdo verbal."}, {"t": "p", "text": "O QUE falamos = ideia/conteúdo verbal."}, {"t": "p", "text": "COMO falamos = comunicação corporal + paralinguagem."}, {"t": "p", "text": "gestos, postura, expressões faciais e corporais, contato visual.", "label": "Comunicação corporal"}, {"t": "p", "text": "modulação, volume, velocidade e fluência da fala.", "label": "Paralinguagem"}, {"t": "p", "text": "O QUE e COMO falamos nem sempre são congruentes."}, {"t": "p", "text": "falar mais pausadamente/mais rápido, olhar diretamente para interlocutores, reduzir/ampliar gesticulação e esperar o outro terminar o turno de fala.", "label": "Exercícios citados"}, {"t": "p", "text": "Nos slides, é apresentada a informação de que 70% do que se compreende em uma interação face a face depende dos componentes da CCP."}, {"t": "p", "text": "observar a própria CCP e a dos interlocutores, conferir o impacto, controlar o impulso de responder imediatamente e ajustar componentes conforme resultados desejáveis.", "label": "Aperfeiçoamento da CCP = automonitoria"}]}, {"title": "Empatia na comunicação", "items": [{"t": "p", "text": "Empatia é compreender e sentir o que alguém pensa ou sente em situação de demanda afetiva e COMUNICAR essa compreensão ao outro, como forma de conforto, apoio e compartilhamento."}, {"t": "p", "text": "Não há possibilidade de competência social sem empatia, segundo os slides."}, {"t": "p", "text": "Uma comunicação empática pode:"}, {"t": "li", "text": "reconhecer a situação;"}, {"t": "li", "text": "demonstrar disposição para ajudar;"}, {"t": "li", "text": "fazer perguntas de esclarecimento;"}, {"t": "li", "text": "incentivar reflexão;"}, {"t": "li", "text": "sintetizar o que a pessoa disse;"}, {"t": "li", "text": "refletir sentimentos."}]}, {"title": "Elogio", "items": [{"t": "p", "text": "Elogiar é uma classe importante de habilidade social de comunicação."}, {"t": "p", "text": "Um elogio eficaz deve ser sincero, específico e direto, e imediato."}, {"t": "p", "text": "Receber elogio também é uma demonstração de habilidade social. Evita-se a falsa humildade, sem cair na arrogância."}]}]}, {"id": 8, "title": "Feedback e Assertividade", "secs": [{"title": "Feedback", "items": [{"t": "p", "text": "No campo das habilidades sociais, feedback é uma descrição verbal ou escrita sobre o desempenho de uma pessoa."}, {"t": "p", "text": "A origem do termo é apresentada na Teoria dos Sistemas, relacionada a sistemas que se autocorrigem, como o termostato."}, {"t": "p", "text": "aumentar ou diminuir a probabilidade de um comportamento-alvo.", "label": "Função do feedback"}]}, {"title": "Feedback positivo x negativo", "items": [{"t": "p", "text": "destaca aspectos de desempenho que podem gerar reforço positivo.", "label": "Feedback positivo"}, {"t": "p", "text": "destaca aspectos do desempenho que precisam ser alterados.", "label": "Feedback negativo"}]}, {"title": "Feedback bom x feedback vago", "items": [{"t": "p", "text": "Feedback inadequado tende a ser vago, genérico ou dirigido à pessoa."}, {"t": "p", "text": "Ex.: “Você é desorganizado.”"}, {"t": "p", "text": "Feedback adequado descreve o comportamento observado, é específico e útil."}, {"t": "p", "text": "Ex.: “Roberto, nas duas últimas semanas os e-mails para os clientes foram enviados após o prazo combinado de 24 horas. Isso tem impactado o tempo de resposta do setor.”"}]}, {"title": "Cinco recomendações para dar feedback", "items": [{"t": "li", "text": "Falar diretamente com a pessoa, chamando pelo nome, com contato visual e tom calmo e audível."}, {"t": "li", "text": "Dar o feedback o mais imediatamente possível após o desempenho."}, {"t": "li", "text": "DESCREVER o desempenho observado, em vez de apenas avaliá-lo."}, {"t": "li", "text": "Referir-se ao COMPORTAMENTO observado, e não à pessoa."}, {"t": "li", "text": "falar apenas o necessário.", "label": "Usar parcimônia"}]}, {"title": "Assertividade", "items": [{"t": "p", "text": "Assertividade é expressar pensamentos, sentimentos, opiniões e necessidades de forma direta, honesta e apropriada, respeitando a si mesmo e ao outro simultaneamente."}, {"t": "p", "text": "postura submissa; ignora os próprios direitos/necessidades; comunicação indireta ou evitativa; pode gerar frustração e ressentimento.", "label": "Passividade"}, {"t": "p", "text": "postura equilibrada; respeita os dois lados; comunicação direta e respeitosa; favorece respeito mútuo.", "label": "Assertividade"}, {"t": "p", "text": "postura dominadora; privilegia minhas necessidades e ignora as do outro; comunicação impositiva/hostil; pode gerar conflito e afastamento.", "label": "Agressividade"}]}, {"title": "Características do comportamento assertivo", "items": [{"t": "li", "text": "“eu penso”, “eu sinto”, “eu preciso”.", "label": "Falar em primeira pessoa"}, {"t": "li", "text": "Expressar discordância sem atacar."}, {"t": "li", "text": "Saber dizer não sem culpa e sim sem submissão."}, {"t": "li", "text": "Manter tom de voz calmo e contato visual direto."}, {"t": "li", "text": "Respeitar limites próprios e alheios."}]}, {"title": "Empatia + assertividade", "items": [{"t": "p", "text": "A aliança entre empatia e assertividade constitui o núcleo da competência social: permite atender às próprias necessidades sem desconsiderar as necessidades do outro."}]}]}], "resumo": ["HABILIDADES SOCIAIS = comportamentos sociais valorizados pela cultura, usados diante de demandas interpessoais.", "COMPETÊNCIA SOCIAL = avaliação de como articulamos nossas HS; exige FUNCIONALIDADE + ÉTICA/RESPEITO.", "REGRA DE OURO = considerar a si mesmo E aos demais.", "COMPORTAMENTO = interação organismo + ambiente; para entender, olhe CONTEXTO + CONSEQUÊNCIAS.", "Sd = antecedente | R = resposta | Sr = consequência.", "Determinantes = FILOGENÉTICOS + ONTOGENÉTICOS + CULTURAIS.", "AGRUPAMENTO ≠ GRUPO ≠ EQUIPE.", "Grupo = interação + vínculos + normas + pertencimento/objetivos.", "Equipe = objetivos comuns + papéis articulados + interdependência + responsabilidade compartilhada + autonomia.", "NORMAS GRUPAIS = geralmente implícitas, mas fortes.", "GRUPO DE REFERÊNCIA = grupo que passa a exercer papel normativo sobre o indivíduo.", "HAWTHORNE = pertencimento/fatores psicológicos importam na motivação; grupo pequeno + objetivo comum + pertencimento favorecem produtividade/satisfação.", "MITOS DAS EQUIPES: equipe nem sempre é melhor; satisfação não é automática; coesão não garante efetividade; interdependência não garante efetividade.", "ESTÁGIOS = FORMAÇÃO → CONFLITO → NORMATIZAÇÃO → DESEMPENHO → DESINTEGRAÇÃO.", "Efetividade = PRODUÇÃO + SATISFAÇÃO + SOBREVIVÊNCIA.", "DIVERSIDADE = diferenças entre pessoas.", "INCLUSÃO = superar barreiras para permitir presença, participação e desempenho.", "Diferença só vira desigualdade através de relações históricas de poder: DIFERENÇA → NORMA DOMINANTE → HIERARQUIA → EFEITO/EXCLUSÃO.", "ESTEREÓTIPO = crença/cognição.", "PRECONCEITO = atitude/afetivo.", "DISCRIMINAÇÃO = ação/comportamento.", "SEGURANÇA PSICOLÓGICA = poder perguntar, discordar, admitir erro, pedir ajuda e apresentar preocupação sem medo de rejeição.", "NÃO significa ausência de conflito nem ausência de cobrança.", "Rogers: EMPATIA + ACEITAÇÃO POSITIVA + CONGRUÊNCIA.", "Condicional pode comprometer autoestima; “tornar-se pessoa” = processo de autenticidade e abertura à mudança.", "COMUNICAÇÃO = não é só transmitir; é transmitir + compreender significado.", "SENSAÇÃO = informação chega ao cérebro.", "PERCEPÇÃO = interpretação dessa informação.", "ATENÇÃO = seleciona/descarta estímulos.", "MEMÓRIA = reconstrutora, não cópia perfeita.", "PENSAMENTO = raciocinar, resolver problemas, formar conceitos.", "LINGUAGEM = representa o mundo e influencia o pensamento.", "EMOÇÃO = interfere em atenção, memória, percepção, raciocínio e decisões.", "CCP = COMO falamos: corporal + paralinguística.", "Corporal = gestos, postura, expressões, contato visual.", "Paralinguística = modulação, volume, velocidade, fluência.", "Automonitoria = observar → verificar impacto → ajustar.", "EMPATIA = compreender/sentir + COMUNICAR essa compreensão.", "ELOGIO = sincero + específico/direto + imediato.", "FEEDBACK = descrição verbal/escrita do desempenho.", "Positivo = destaca o que pode ser reforçado.", "Negativo = aponta o que precisa mudar.", "Feedback bom = imediato + específico + descreve o desempenho + fala do comportamento + parcimônia.", "ASSERTIVIDADE = direta + honesta + apropriada + respeita a si e ao outro.", "Passivo = ignora a si.", "Agressivo = ignora o outro.", "Assertivo = considera os dois."], "frase": "ENTENDER O COMPORTAMENTO EXIGE CONTEXTO; ENTENDER O GRUPO EXIGE OLHAR NORMAS E PODER; INCLUIR É QUESTIONAR BARREIRAS; COMUNICAR É TRANSMITIR E COMPREENDER; EMPATIA + ASSERTIVIDADE = COMPETÊNCIA SOCIAL; FEEDBACK FALA DO COMPORTAMENTO, NÃO ROTULA A PESSOA.", "macetes": ["“Habilidade social” = comportamento valorizado; “competência social” = avaliação de como essa habilidade foi articulada.", "Competência social = FUNCIONALIDADE + ÉTICA.", "Comportamento = nunca olhe só a resposta: veja CONTEXTO + CONSEQUÊNCIAS.", "Sd = antes; R = comportamento; Sr = depois.", "Filo = espécie; onto = indivíduo/aprendizagem; cultural = grupo/sociedade.", "Agrupamento = juntos; grupo = interagem; equipe = interdependem para meta comum.", "Grupo de referência = exerce papel normativo.", "Hawthorne = não foi só “luz”; fatores psicológicos/pertencimento ganharam destaque.", "Mitos = “sempre” é a palavra suspeita: equipe, satisfação, coesão e interdependência NÃO garantem automaticamente efetividade.", "Efetividade = produção + satisfação + sobrevivência.", "Formação = conhecer; conflito = negociar; normatização = organizar/coesar; desempenho = produzir; desintegração = encerrar/novo ciclo.", "Diversidade = diferença; inclusão = remover barreiras.", "Estereótipo = COGNIÇÃO; preconceito = AFETO/ATITUDE; discriminação = AÇÃO.", "Segurança psicológica = risco interpessoal seguro, não ausência de conflito.", "Rogers = empatia + aceitação positiva + congruência.", "Condicional = “aceito se…”; incondicional = aceitação da pessoa como ela é.", "Comunicação = transmitir + compreender.", "Sensação = chegar ao cérebro; percepção = interpretar.", "Atenção = selecionar; memória = reconstruir; pensamento = raciocinar; linguagem = representar; emoção = influenciar/organizar decisões.", "CCP = COMO falamos; corporal + paralinguística.", "Empatia = compreender/sentir + COMUNICAR.", "Elogio = sincero + específico + imediato.", "Feedback = descrever desempenho/comportamento, não rotular pessoa.", "Assertividade = nem “eu abaixo de todos”, nem “todos abaixo de mim”: respeita os dois lados."], "qs": [{"n": 1, "q": "Habilidades sociais, segundo os slides, podem ser entendidas como:", "o": {"A": "Comportamentos socialmente valorizados apresentados diante de demandas interpessoais.", "B": "Apenas conhecimentos técnicos utilizados no trabalho.", "C": "Regras formais impostas pela organização.", "D": "Somente habilidades de comunicação verbal.", "E": "Características exclusivamente genéticas que determinam a personalidade."}, "c": "A", "e": "Habilidades sociais são comportamentos socialmente valorizados apresentados diante de demandas interpessoais.", "a": 1}, {"n": 2, "q": "Quando as habilidades sociais são tratadas como CAMPO TEÓRICO, o foco está em:", "o": {"A": "Identificar apenas competências técnicas.", "B": "Estudar estratégias e comportamentos que favorecem interações humanas bem-sucedidas.", "C": "Padronizar os comportamentos de todas as culturas.", "D": "Eliminar qualquer conflito das relações humanas.", "E": "Estudar somente transtornos psicológicos."}, "c": "B", "e": "Como campo teórico, estudam estratégias e comportamentos para que as interações sejam bem-sucedidas.", "a": 1}, {"n": 3, "q": "Qual alternativa contém apenas exemplos de comportamentos sociais desejáveis apresentados na aula?", "o": {"A": "Isolar-se, autodepreciar-se e submeter-se.", "B": "Agredir, enganar e desrespeitar.", "C": "Manifestar empatia, expressar sentimentos e aceitar/rejeitar críticas.", "D": "Evitar autoridades, não discordar e permanecer em silêncio.", "E": "Coagir, manipular e omitir-se."}, "c": "C", "e": "Respeito, empatia, expressão e manejo de críticas aparecem como exemplos desejáveis.", "a": 1}, {"n": 4, "q": "Sobre comportamentos desejáveis e indesejáveis, os slides afirmam que:", "o": {"A": "A passividade e a assertividade são equivalentes.", "B": "Apenas os desejáveis são mantidos por consequências.", "C": "Os indesejáveis sempre desaparecem com o tempo.", "D": "Ambos são comportamentos concorrentes e podem se manter por suas consequências.", "E": "A agressividade é sempre um comportamento social desejável."}, "c": "D", "e": "Desejáveis e indesejáveis são comportamentos concorrentes e podem ser mantidos pelas consequências.", "a": 1}, {"n": 5, "q": "Competência social é melhor definida como:", "o": {"A": "Sinônimo de competência técnica.", "B": "Ausência completa de conflitos.", "C": "Capacidade de falar bastante em reuniões.", "D": "Capacidade de influenciar outras pessoas, independentemente da ética.", "E": "Avaliação do desempenho das habilidades sociais de acordo com a cultura, considerando funcionalidade e ética."}, "c": "E", "e": "Competência social é avaliativa e envolve articulação das HS com adequação cultural, funcionalidade e ética.", "a": 1}, {"n": 6, "q": "Um comportamento que atinge o objetivo da pessoa, mas viola direitos humanos, é, de acordo com a aula:", "o": {"A": "Inadequado porque funcionalidade, sozinha, não basta.", "B": "Sempre passivo.", "C": "Necessariamente competente socialmente.", "D": "Competente apenas porque funcionou.", "E": "Socialmente competente se for eficiente."}, "c": "A", "e": "A funcionalidade é necessária, mas não suficiente; ética e respeito aos direitos humanos também contam.", "a": 1}, {"n": 7, "q": "A “regra de ouro” de Joseph Wolpe propõe:", "o": {"A": "Evitar qualquer confronto.", "B": "Considerar a si mesmo e também aos demais.", "C": "Nunca expressar sentimentos.", "D": "Considerar somente a própria necessidade.", "E": "Colocar sempre as necessidades dos outros acima das próprias."}, "c": "B", "e": "A regra de ouro é considerar a si mesmo e também aos demais.", "a": 1}, {"n": 8, "q": "Assinale a alternativa que NÃO corresponde à importância das habilidades sociais apresentada nos slides:", "o": {"A": "Estão associadas ao desempenho acadêmico.", "B": "Relacionam-se à saúde e ao bem-estar no trabalho.", "C": "Tornam desnecessárias as competências técnicas.", "D": "Funcionam como via de expressão e desenvolvimento de outras competências.", "E": "Favorecem a inserção no mercado de trabalho."}, "c": "C", "e": "HS não substituem competências técnicas; elas ajudam a expressá-las e desenvolvê-las.", "a": 1}, {"n": 9, "q": "A realidade psíquica, segundo os slides, é:", "o": {"A": "Independente de experiências anteriores.", "B": "Uma cópia perfeita do mundo externo.", "C": "Igual para todas as pessoas que vivem o mesmo evento.", "D": "Elaborada a partir dos conteúdos armazenados na mente e da interpretação dos estímulos.", "E": "Determinada apenas por fatores genéticos."}, "c": "D", "e": "A realidade psíquica é construída a partir do que a pessoa registra e interpreta.", "a": 1}, {"n": 10, "q": "Por que uma habilidade social não pode ser analisada fora da cultura?", "o": {"A": "Porque cultura elimina a necessidade de empatia.", "B": "Porque comportamento social é somente biológico.", "C": "Porque habilidades sociais são sempre inconscientes.", "D": "Porque todas as culturas possuem exatamente as mesmas regras sociais.", "E": "Porque o que é valorizado socialmente pode variar conforme a cultura."}, "c": "E", "e": "Os comportamentos socialmente valorizados variam conforme a cultura.", "a": 1}, {"n": 11, "q": "Segundo Botomé e Kienen, comportamento é:", "o": {"A": "A interação entre aquilo que o organismo faz e aspectos do ambiente.", "B": "Somente uma reação emocional.", "C": "Apenas uma resposta a estímulos internos.", "D": "Apenas aquilo que uma pessoa faz.", "E": "Uma característica fixa da personalidade."}, "c": "A", "e": "Comportamento é interação entre ação do organismo e ambiente.", "a": 2}, {"n": 12, "q": "Por que não é adequado interpretar um comportamento olhando apenas para a resposta observada?", "o": {"A": "Porque todo comportamento é aleatório.", "B": "Porque é necessário considerar contexto e multideterminação causal.", "C": "Porque a resposta nunca importa.", "D": "Porque o ambiente não influencia o comportamento.", "E": "Porque apenas a genética explica comportamento."}, "c": "B", "e": "Contexto e multideterminação causal são fundamentais para interpretação funcional.", "a": 2}, {"n": 13, "q": "Um aluno permanece calado porque está com medo de uma punição do professor. Nesse caso, o silêncio pode exercer a função de:", "o": {"A": "Reforço positivo.", "B": "Normatização.", "C": "Esquiva.", "D": "Cooperação.", "E": "Liderança."}, "c": "C", "e": "No exemplo da aula, o silêncio pode funcionar como esquiva de uma punição.", "a": 2}, {"n": 14, "q": "Na tríplice contingência Sd → R → Sr, o “R” representa:", "o": {"A": "A avaliação ética.", "B": "O contexto cultural.", "C": "O estímulo antecedente.", "D": "A resposta/comportamento emitido.", "E": "O estímulo consequente."}, "c": "D", "e": "R é a resposta, isto é, o comportamento emitido.", "a": 2}, {"n": 15, "q": "No exemplo do colega abatido, a aproximação do profissional com postura aberta, contato visual e fala empática representa:", "o": {"A": "Sr.", "B": "Norma social.", "C": "Conformidade.", "D": "Sd.", "E": "R."}, "c": "E", "e": "A aproximação e a fala do profissional são a resposta comportamental.", "a": 2}, {"n": 16, "q": "O determinante FILOGENÉTICO está relacionado principalmente a:", "o": {"A": "Características herdadas e história evolutiva da espécie.", "B": "Regras informais do grupo.", "C": "Formação profissional.", "D": "História de aprendizagem individual.", "E": "Práticas sociais compartilhadas."}, "c": "A", "e": "Filogenético = características herdadas e história evolutiva da espécie.", "a": 2}, {"n": 17, "q": "O determinante ONTOGENÉTICO refere-se a:", "o": {"A": "História evolutiva da espécie.", "B": "História individual de aprendizagem e contingências ao longo da vida.", "C": "Cultura do grupo.", "D": "Estrutura física do ambiente.", "E": "Características exclusivamente biológicas."}, "c": "B", "e": "Ontogenético = história individual de aprendizagem e contingências ao longo da vida.", "a": 2}, {"n": 18, "q": "O determinante CULTURAL está relacionado a:", "o": {"A": "Características genéticas.", "B": "Reflexos inatos.", "C": "Práticas e contingências sociais compartilhadas por um grupo.", "D": "Apenas experiências escolares.", "E": "Somente emoções básicas."}, "c": "C", "e": "Cultural = práticas e contingências sociais compartilhadas.", "a": 2}, {"n": 19, "q": "Nos slides sobre Behaviorismo Radical no trabalho, estresse, desmotivação e burnout são apresentados como:", "o": {"A": "Tipos de normas sociais.", "B": "Causas universais do comportamento.", "C": "Características genéticas.", "D": "Efeitos de contingências aversivas e ausência de reforços positivos no contexto organizacional.", "E": "Sinônimos de competência social."}, "c": "D", "e": "Essa é exatamente a leitura do Behaviorismo Radical apresentada nos slides.", "a": 2}, {"n": 20, "q": "Assinale a alternativa correta sobre comportamento organizacional:", "o": {"A": "Ignora processos como pensar, perceber e decidir.", "B": "Estuda somente relações fora do trabalho.", "C": "Estuda apenas o comportamento observável individual.", "D": "Estuda apenas líderes.", "E": "Busca prever, explicar e compreender o comportamento humano nas organizações, incluindo indivíduos, grupos e fenômenos emergentes."}, "c": "E", "e": "O campo estuda indivíduos, grupos, organizações e processos observáveis e interiores.", "a": 2}, {"n": 21, "q": "Qual situação é o melhor exemplo de AGRUPAMENTO?", "o": {"A": "Pessoas esperando atendimento numa fila, sem vínculo ou objetivo compartilhado.", "B": "Um grupo de amigos que joga futebol regularmente.", "C": "Uma força-tarefa com meta coletiva.", "D": "Uma equipe de hospital com papéis interdependentes.", "E": "Uma turma de estudantes que interage ao longo do tempo."}, "c": "A", "e": "Fila sem interação/vínculo/objetivo comum é o exemplo clássico de agrupamento.", "a": 3}, {"n": 22, "q": "O que caracteriza principalmente um GRUPO?", "o": {"A": "Apenas ocupar o mesmo espaço físico.", "B": "Interação, vínculos, normas e pertencimento/objetivos compartilhados.", "C": "Necessariamente ter liderança formal.", "D": "Ser sempre uma equipe autônoma.", "E": "Não possuir história compartilhada."}, "c": "B", "e": "Interação, vínculos, normas e pertencimento/objetivos diferenciam grupo de simples agrupamento.", "a": 3}, {"n": 23, "q": "Uma EQUIPE se diferencia de um grupo por apresentar, com maior intensidade:", "o": {"A": "Ausência de interação.", "B": "Objetivos exclusivamente individuais.", "C": "Interdependência, meta compartilhada e responsabilidade pelos resultados.", "D": "Proibição de autonomia.", "E": "Isolamento entre membros."}, "c": "C", "e": "Interdependência, meta compartilhada e responsabilidade global são marcas centrais da equipe.", "a": 3}, {"n": 24, "q": "Segundo os slides, um conjunto tende a ser “mais grupo” quando:", "o": {"A": "Cada membro trabalha isoladamente.", "B": "Aumenta o número de integrantes e diminui a interação.", "C": "Diminui a história compartilhada.", "D": "Aumenta a interação e fica mais clara a perspectiva de futuro partilhado.", "E": "Desaparecem os vínculos."}, "c": "D", "e": "Mais interação e futuro partilhado claro aumentam a caracterização do conjunto como grupo.", "a": 3}, {"n": 25, "q": "Grupo de referência é aquele:", "o": {"A": "Que possui poder formal máximo.", "B": "Formado somente por familiares.", "C": "Que existe apenas em organizações.", "D": "Que possui obrigatoriamente mais integrantes.", "E": "Com o qual o indivíduo se motiva a manter relações e que pode exercer papel normativo sobre seu comportamento."}, "c": "E", "e": "O grupo de referência exerce papel normativo por ser um grupo com o qual a pessoa quer manter relações.", "a": 3}, {"n": 26, "q": "Sobre normas grupais, é correto afirmar que:", "o": {"A": "Podem ser implícitas e reguladas por aceitação/prestígio ou admoestação/exclusão.", "B": "Não têm efeito sobre o comportamento.", "C": "Só existem quando registradas em contrato.", "D": "São sempre escritas e formais.", "E": "Nunca produzem punições sociais."}, "c": "A", "e": "Normas podem ser informais e reguladas por aceitação, prestígio, admoestação ou exclusão.", "a": 3}, {"n": 27, "q": "Segundo Moscovici, diante de objetos sociais ambíguos, indivíduos podem:", "o": {"A": "Ignorar totalmente o grupo.", "B": "Apoiar-se no julgamento dos outros e formar uma norma comum.", "C": "Recusar qualquer influência social.", "D": "Considerar apenas fatores genéticos.", "E": "Abandonar imediatamente o grupo."}, "c": "B", "e": "A norma comum pode surgir do apoio ao julgamento dos outros diante de situações ambíguas.", "a": 3}, {"n": 28, "q": "Nos slides, “maioria x minoria” em termos de influência social refere-se principalmente a:", "o": {"A": "Escolaridade média.", "B": "Número de pessoas.", "C": "Poder e influência, não necessariamente ao tamanho numérico.", "D": "Idade dos participantes.", "E": "Tempo de empresa."}, "c": "C", "e": "A aula destaca que maioria/minoria, nesse contexto, diz respeito ao poder, não só ao número.", "a": 3}, {"n": 29, "q": "Sobre o núcleo central de poder, os slides indicam que:", "o": {"A": "Poder e resistência à mudança não possuem relação.", "B": "Quanto mais central, mais flexível à mudança.", "C": "Membros periféricos são sempre os mais resistentes.", "D": "Quanto mais central e identificado com o grupo, maior a resistência à mudança.", "E": "O organograma sempre mostra perfeitamente o poder real."}, "c": "D", "e": "Quanto mais central a posição de poder, maior tende a ser a resistência à mudança.", "a": 3}, {"n": 30, "q": "Na experiência de Hawthorne, a hipótese inicial relacionava produtividade principalmente a:", "o": {"A": "Inteligência emocional.", "B": "Feedback assertivo.", "C": "Segurança psicológica.", "D": "Diversidade cultural.", "E": "Iluminação e fatores extrínsecos."}, "c": "E", "e": "A hipótese inicial de Hawthorne relacionava iluminação e produtividade.", "a": 3}, {"n": 31, "q": "O resultado-surpresa de Hawthorne foi que:", "o": {"A": "A produtividade aumentava independentemente da iluminação.", "B": "A produtividade não tinha relação com pessoas.", "C": "A única variável relevante era salário.", "D": "A produtividade caiu com qualquer mudança.", "E": "A produtividade aumentava somente com iluminação forte."}, "c": "A", "e": "A produtividade aumentava mesmo independentemente da iluminação.", "a": 3}, {"n": 32, "q": "A liderança, segundo a aula, deve ser entendida como:", "o": {"A": "Característica puramente individual.", "B": "Fenômeno sempre grupal, relacionado à capacidade de sintetizar as aspirações do grupo.", "C": "Sinônimo de inteligência.", "D": "Sinônimo de carisma.", "E": "Relação que não depende do contexto social."}, "c": "B", "e": "Liderança é fenômeno grupal e envolve refletir/sintetizar aspirações do grupo.", "a": 3}, {"n": 33, "q": "Qual alternativa melhor diferencia grupo e equipe?", "o": {"A": "Não existe diferença de intensidade entre os dois.", "B": "Grupo sempre possui meta coletiva e equipe nunca possui.", "C": "Equipes tendem a apresentar maior intensidade de esforço coletivo, responsabilidade compartilhada, meta comum e autonomia.", "D": "Grupo possui sempre mais autonomia que equipe.", "E": "Equipe é simplesmente um agrupamento maior."}, "c": "C", "e": "A diferença está principalmente na intensidade de esforço coletivo, responsabilidade, meta, autonomia e liderança.", "a": 3}, {"n": 34, "q": "Qual é um dos “mitos urbanos” desconstruídos na aula?", "o": {"A": "Comunicação é importante para grupos.", "B": "Equipes podem ter objetivos compartilhados.", "C": "Toda equipe precisa de pelo menos dez pessoas.", "D": "Maior coesão garante automaticamente maior efetividade.", "E": "Todo grupo possui normas."}, "c": "D", "e": "“Maior coesão = maior efetividade” é um dos quatro mitos desconstruídos.", "a": 3}, {"n": 35, "q": "Sobre a coesão das equipes, os slides indicam que:", "o": {"A": "Confraternizações garantem efetividade.", "B": "Coesão e efetividade são sinônimos.", "C": "Mais coesão sempre produz melhor desempenho.", "D": "Coesão é irrelevante em qualquer contexto.", "E": "Coesão pode ser uma “faca de dois gumes”, pois pode direcionar esforços para metas pessoais."}, "c": "E", "e": "A coesão pode favorecer ou prejudicar a efetividade dependendo das normas e metas às quais o esforço é dirigido.", "a": 3}, {"n": 36, "q": "Na fase de FORMAÇÃO, a equipe apresenta principalmente:", "o": {"A": "Incerteza sobre papéis, normas e responsabilidades.", "B": "Encerramento do ciclo.", "C": "Estratégias totalmente consolidadas.", "D": "Ausência de interação.", "E": "Máxima produtividade."}, "c": "A", "e": "Formação é marcada por conhecimento entre membros e incerteza sobre papéis e normas.", "a": 3}, {"n": 37, "q": "Na fase de CONFLITO, é importante:", "o": {"A": "Eliminar toda divergência imediatamente.", "B": "Lidar com o conflito e negociar papéis e responsabilidades.", "C": "Dissolver a equipe.", "D": "Evitar qualquer liderança.", "E": "Ignorar diferenças entre membros."}, "c": "B", "e": "Na fase de conflito, a questão é negociar e LIDAR com o conflito, não simplesmente eliminá-lo.", "a": 3}, {"n": 38, "q": "Na NORMATIZAÇÃO, ocorre principalmente:", "o": {"A": "Aumento da incerteza.", "B": "Dissolução da equipe.", "C": "Aumento da coesão e aceitação/definição de papéis e estratégias.", "D": "Máxima produtividade necessariamente.", "E": "Ausência de normas."}, "c": "C", "e": "Normatização traz maior coesão, trocas mais abertas e papéis/estratégias mais definidos.", "a": 3}, {"n": 39, "q": "Qual sequência corresponde aos estágios apresentados?", "o": {"A": "Normatização → Formação → Desempenho → Conflito → Desintegração.", "B": "Formação → Desempenho → Conflito → Normatização → Desintegração.", "C": "Conflito → Formação → Desempenho → Normatização → Desintegração.", "D": "Formação → Conflito → Normatização → Desempenho → Desintegração.", "E": "Formação → Normatização → Conflito → Desintegração → Desempenho."}, "c": "D", "e": "A sequência dos cinco estágios apresentada é Formação → Conflito → Normatização → Desempenho → Desintegração.", "a": 3}, {"n": 40, "q": "Para ser considerada efetiva, uma equipe precisa reunir simultaneamente:", "o": {"A": "Autonomia e liderança formal.", "B": "Coesão e interdependência elevadas.", "C": "Alta produção apenas.", "D": "Satisfação apenas.", "E": "Produção, satisfação dos membros e sobrevivência da equipe."}, "c": "E", "e": "Produção, satisfação e sobrevivência precisam coexistir para a efetividade.", "a": 3}, {"n": 41, "q": "Uma equipe alcança resultados excelentes, mas seus membros apresentam elevada insatisfação. De acordo com os slides:", "o": {"A": "A equipe pode ser muito produtiva, mas não é considerada efetiva.", "B": "Isso prova que equipes não funcionam.", "C": "A efetividade depende apenas da liderança.", "D": "A equipe é automaticamente efetiva.", "E": "A produção elimina a necessidade de satisfação."}, "c": "A", "e": "Elevada produtividade sem satisfação não basta para classificar a equipe como efetiva.", "a": 3}, {"n": 42, "q": "Qual medida aparece entre as estratégias para tornar equipes efetivas?", "o": {"A": "Evitar feedback durante o trabalho.", "B": "Combinar autonomia e suporte com recompensas individuais e coletivas e feedback periódico.", "C": "Usar somente recompensas individuais.", "D": "Manter objetivos secretos.", "E": "Retirar toda autonomia dos membros."}, "c": "B", "e": "Os slides destacam tamanho/competências, autonomia/suporte, recompensas e feedback periódico.", "a": 3}, {"n": 43, "q": "Diversidade, segundo os slides, refere-se:", "o": {"A": "Exclusivamente a diferenças genéticas.", "B": "Apenas a diferenças de opinião política.", "C": "À diferença entre as pessoas em dimensões como raça, gênero, cultura, religião, classe, habilidades e situação migratória.", "D": "Somente à presença de pessoas de origens diferentes.", "E": "Apenas à diversidade dentro de empresas."}, "c": "C", "e": "Diversidade inclui várias dimensões das diferenças humanas citadas na aula.", "a": 4}, {"n": 44, "q": "Inclusão é melhor definida como:", "o": {"A": "Impedir questionamentos às normas existentes.", "B": "Adaptar todas as pessoas à mesma norma.", "C": "Aumentar a competição entre grupos.", "D": "Processo que ajuda a superar barreiras que limitam presença, participação e desempenho.", "E": "Garantir que todos pensem da mesma forma."}, "c": "D", "e": "Inclusão é superar barreiras que limitam presença, participação e desempenho.", "a": 4}, {"n": 45, "q": "A frase “o problema não é apenas entrar, é poder participar” destaca que:", "o": {"A": "Diversidade deve ser evitada.", "B": "Regras formais resolvem qualquer barreira.", "C": "Apenas desempenho importa.", "D": "Presença física é suficiente.", "E": "Inclusão envolve condições reais de participação."}, "c": "E", "e": "Participar de fato é parte essencial da inclusão.", "a": 4}, {"n": 46, "q": "Na leitura apresentada sobre normas, a norma funciona também como:", "o": {"A": "Padrão de comparação, classificação e hierarquização.", "B": "Regra exclusivamente jurídica.", "C": "Fenômeno apenas biológico.", "D": "Ferramenta de eliminação de diferenças.", "E": "Sinônimo de comportamento assertivo."}, "c": "A", "e": "A norma também funciona como padrão que compara, classifica e hierarquiza.", "a": 4}, {"n": 47, "q": "A sequência apresentada para compreender quando a diferença vira desigualdade é:", "o": {"A": "Diferença → amizade → igualdade → inclusão.", "B": "Diferença → norma dominante → hierarquia → efeito/exclusão.", "C": "Diferença → empatia → liderança → cooperação.", "D": "Norma → diversidade → igualdade → poder.", "E": "Inclusão → diferença → exclusão → norma."}, "c": "B", "e": "Essa é a sequência apresentada para explicar a passagem da diferença à desigualdade/exclusão.", "a": 4}, {"n": 48, "q": "O que significa “desnaturalizar” uma norma?", "o": {"A": "Considerar que história e poder não importam.", "B": "Aceitá-la como natural.", "C": "Perguntar quem a definiu, que saber a legitimou, quem se beneficia, quando surgiu e quais efeitos produz.", "D": "Impedir questionamentos.", "E": "Substituir toda norma por ausência de regras."}, "c": "C", "e": "Desnaturalizar é justamente perguntar pela história, legitimidade, beneficiários, reprodução e efeitos da norma.", "a": 4}, {"n": 49, "q": "“Idosos têm dificuldade com tecnologia” é apresentado como exemplo de:", "o": {"A": "Assertividade.", "B": "Discriminação.", "C": "Preconceito afetivo.", "D": "Estereótipo.", "E": "Segurança psicológica."}, "c": "D", "e": "“Idosos têm dificuldade com tecnologia” é uma crença generalizada sobre um grupo: estereótipo.", "a": 4}, {"n": 50, "q": "Uma pessoa sente aversão ou atitude negativa em relação a determinado grupo. Isso corresponde, na estrutura da aula, a:", "o": {"A": "Discriminação.", "B": "Inclusão.", "C": "Congruência.", "D": "Estereótipo.", "E": "Preconceito."}, "c": "E", "e": "Atitude negativa em relação a um grupo corresponde ao componente afetivo/preconceito.", "a": 4}, {"n": 51, "q": "Uma empresa deixa de contratar uma pessoa por pertencer a determinado grupo. O exemplo corresponde a:", "o": {"A": "Discriminação.", "B": "Consideração positiva.", "C": "Comunicação eficaz.", "D": "Estereótipo.", "E": "Empatia."}, "c": "A", "e": "Discriminação está relacionada à ação realizada contra alguém em razão de pertencimento a um grupo.", "a": 4}, {"n": 52, "q": "A associação correta entre componente e conceito é:", "o": {"A": "Cognitivo = discriminação; afetivo = estereótipo; comportamental = preconceito.", "B": "Cognitivo = estereótipo; afetivo = preconceito; comportamental = discriminação.", "C": "Cognitivo = inclusão; afetivo = congruência; comportamental = empatia.", "D": "Cognitivo = feedback; afetivo = norma; comportamental = grupo.", "E": "Cognitivo = agressividade; afetivo = assertividade; comportamental = passividade."}, "c": "B", "e": "Cognitivo = estereótipo; afetivo = preconceito; comportamental = discriminação.", "a": 4}, {"n": 53, "q": "Sobre o racismo estrutural, os slides destacam que ele:", "o": {"A": "É apenas uma questão individual.", "B": "Não tem relação com desigualdade.", "C": "Participa da reprodução de desigualdades e violências e pode manter hierarquias e naturalizar desigualdades.", "D": "Desaparece quando nenhuma pessoa admite ser racista.", "E": "É sinônimo de estereótipo."}, "c": "C", "e": "O slide define o racismo estrutural como mecanismo de reprodução de desigualdade e violência.", "a": 4}, {"n": 54, "q": "Branquitude é apresentada na aula como:", "o": {"A": "Um tipo de habilidade social.", "B": "Ausência de identidade racial.", "C": "Apenas uma característica fenotípica.", "D": "Um lugar simbólico de privilégio ligado a posições sociais, além do fenótipo.", "E": "Sinônimo de preconceito individual."}, "c": "D", "e": "Branquitude é apresentada como lugar simbólico de privilégio ligado a posições sociais, não apenas ao fenótipo.", "a": 4}, {"n": 55, "q": "Os “pactos narcísicos”, na formulação apresentada na aula, relacionam-se a:", "o": {"A": "Feedback positivo.", "B": "Processos de percepção subliminar.", "C": "Estágios de desenvolvimento de equipes.", "D": "Estratégias de estudo em equipe.", "E": "Alianças que, no contexto racial, podem envolver negação do problema, silenciamento e exclusão de negros de espaços de poder."}, "c": "E", "e": "Pactos narcísicos são associados à negação, silenciamento e exclusão racial em espaços de poder.", "a": 4}, {"n": 56, "q": "Segurança psicológica NÃO significa:", "o": {"A": "Ausência total de conflitos e de cobrança.", "B": "Poder apresentar preocupações.", "C": "Poder admitir erros.", "D": "Poder pedir ajuda.", "E": "Poder discordar."}, "c": "A", "e": "Segurança psicológica não elimina conflito nem reduz exigência; ela permite assumir riscos interpessoais.", "a": 4}, {"n": 57, "q": "Qual situação demonstra segurança psicológica?", "o": {"A": "O grupo pune quem admite erro.", "B": "Um funcionário pode discordar de uma decisão e explicar sua preocupação sem medo de rejeição.", "C": "Ninguém pode questionar o líder.", "D": "Conflitos são proibidos.", "E": "Funcionários evitam perguntas por medo de serem ridicularizados."}, "c": "B", "e": "Poder discordar sem medo de rejeição é exemplo direto de segurança psicológica.", "a": 4}, {"n": 58, "q": "As três condições destacadas para sustentar a segurança psicológica são:", "o": {"A": "Estereótipo, preconceito e discriminação.", "B": "Poder, coesão e punição.", "C": "Empatia, aceitação positiva e congruência.", "D": "Inteligência, carisma e liderança.", "E": "Memória, atenção e percepção."}, "c": "C", "e": "As três condições são empatia, aceitação positiva e congruência.", "a": 4}, {"n": 59, "q": "Na perspectiva apresentada de Carl Rogers, a consideração positiva CONDICIONAL:", "o": {"A": "Garante autenticidade.", "B": "Elimina vulnerabilidade.", "C": "Não produz nenhum efeito sobre o indivíduo.", "D": "Pode comprometer a autoestima e deslocar o centro de referência para o externo.", "E": "É exatamente igual à incondicional."}, "c": "D", "e": "A consideração condicional pode comprometer autoestima e deslocar o centro de referência para o externo.", "a": 4}, {"n": 60, "q": "“Tornar-se pessoa”, para Rogers, é melhor compreendido como:", "o": {"A": "Abandonar qualquer mudança.", "B": "Adaptar-se completamente às normas sociais.", "C": "Evitar experiências novas.", "D": "Chegar a uma versão perfeita e final de si mesmo.", "E": "Um processo contínuo de autenticidade, aceitação e abertura à mudança."}, "c": "E", "e": "“Tornar-se pessoa” é processo contínuo, não estado final perfeito.", "a": 4}, {"n": 61, "q": "Na construção de um ambiente seguro, a ordem geral apresentada é:", "o": {"A": "Tornar visível → escutar com qualidade → transformar a prática.", "B": "Avaliar → eliminar conflitos → impor normas.", "C": "Excluir → investigar → normalizar.", "D": "Falar → interromper → concluir.", "E": "Punir → silenciar → cobrar."}, "c": "A", "e": "O caminho apresentado é tornar visível → escutar com qualidade → transformar a prática.", "a": 4}, {"n": 62, "q": "Em um relato de discriminação, qual sequência corresponde ao exemplo dos slides?", "o": {"A": "Investigar → ignorar → rep
